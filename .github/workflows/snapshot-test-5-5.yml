name: Snapshot Test 5.5 status

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/snapshot-test-5-5.yml"

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Capture Test 5.5 runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p status
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow test-5-5-latent-modal-integration.yml \
            --limit 10 \
            --json databaseId,status,conclusion,headSha,event,createdAt,updatedAt,url \
            > status/test-5-5-runs.json
          python -m json.tool status/test-5-5-runs.json > status/formatted.json
          mv status/formatted.json status/test-5-5-runs.json
      - name: Persist snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/test-5-5-runs.json
          git commit -m "status: snapshot Test 5.5 runs ${GITHUB_RUN_ID}" || true
          git pull --rebase origin main
          git push origin HEAD:main
