name: Modal MoE — OLMoE layer 7 scout

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/modal-moe.yml"
      - "experiment/archive.part-*"

permissions:
  contents: write

concurrency:
  group: modal-moe-l7-scout
  cancel-in-progress: true

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      NUMEXPR_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_XET: "1"

    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Register workflow run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "workflow": "Modal MoE — OLMoE layer 7 scout",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "status": "running",
              "commit": os.environ["GITHUB_SHA"],
              "started_at": datetime.now(timezone.utc).isoformat(),
          }
          Path("runs/latest.json").write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/latest.json
          git commit -m "chore: register Modal MoE run ${GITHUB_RUN_ID}"
          git push origin HEAD:main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild and verify experiment archive
        shell: bash
        run: |
          set -euo pipefail
          cat experiment/archive.part-* | base64 --decode > "$RUNNER_TEMP/modal_moe_experiment.zip"
          echo "363c296bac175dfb71a7594777e5239d3363ab045b3b5700737b4cf88ac4a323  $RUNNER_TEMP/modal_moe_experiment.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/modal_moe_experiment.zip"
          test -f modal_moe_experiment/modal_moe_weight_probe_v2.py

      - name: Install CPU-only dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu "torch>=2.3"
          python -m pip install --no-cache-dir \
            "numpy>=2.0" "requests>=2.31" "safetensors>=0.4.3" \
            "pytest>=8.0" "huggingface_hub>=0.24"

      - name: Validate probe
        working-directory: modal_moe_experiment
        shell: bash
        run: python -m pytest -q

      - name: Run real three-seed scout
        working-directory: modal_moe_experiment
        shell: bash
        env:
          PYTHON_BIN: python
          RESULT_ROOT: ${{ github.workspace }}/modal_moe_experiment/results/olmoe_l7_scout
          RANGE_CACHE: ${{ runner.temp }}/olmoe-range-cache
          HF_HOME: ${{ runner.temp }}/huggingface
        run: |
          set -uo pipefail
          bash run_olmoe_l7_scout.sh 2>&1 | tee cloud-run.log
          status=${PIPESTATUS[0]}

          if [[ "$status" -ne 0 ]]; then
            echo "HTTP Range mode failed; retrying with the complete checkpoint shard." | tee -a cloud-run.log
            rm -rf "$RESULT_ROOT" "$RANGE_CACHE"
            mkdir -p "$RUNNER_TEMP/olmoe-shard"

            python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download

          path = hf_hub_download(
              repo_id="allenai/OLMoE-1B-7B-0924",
              filename="model-00002-of-00003.safetensors",
              revision="3a970199d0f87db4e3e57275abb93812bf10fd83",
              local_dir=os.path.join(os.environ["RUNNER_TEMP"], "olmoe-shard"),
          )
          with open(os.path.join(os.environ["RUNNER_TEMP"], "shard_path.txt"), "w", encoding="utf-8") as handle:
              handle.write(path)
          print(path)
          PY
            download_status=$?
            if [[ "$download_status" -ne 0 ]]; then
              exit "$download_status"
            fi

            export SHARD_PATH="$(cat "$RUNNER_TEMP/shard_path.txt")"
            bash run_olmoe_l7_scout.sh 2>&1 | tee -a cloud-run.log
            status=${PIPESTATUS[0]}
          fi

          exit "$status"

      - name: Publish verdict in run summary
        if: always()
        shell: bash
        run: |
          verdict="modal_moe_experiment/results/olmoe_l7_scout/aggregate/VERDICT.md"
          if [[ -f "$verdict" ]]; then
            cat "$verdict" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' '## Modal MoE scout' '' 'No aggregate verdict was produced. Inspect cloud-run.log.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Persist compact result in repository
        if: always()
        shell: bash
        env:
          RUN_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          rm -rf results/latest
          mkdir -p results/latest

          aggregate="modal_moe_experiment/results/olmoe_l7_scout/aggregate"
          if [[ -d "$aggregate" ]]; then
            cp -a "$aggregate" results/latest/aggregate
          fi

          for seed_dir in modal_moe_experiment/results/olmoe_l7_scout/seed-*; do
            [[ -d "$seed_dir" ]] || continue
            destination="results/latest/$(basename "$seed_dir")"
            mkdir -p "$destination"
            for name in modal_weight_probe_v2.json modal_weight_probe_v2.csv; do
              [[ -f "$seed_dir/$name" ]] && cp "$seed_dir/$name" "$destination/"
            done
          done

          if [[ -f modal_moe_experiment/cloud-run.log ]]; then
            tail -n 1000 modal_moe_experiment/cloud-run.log > results/latest/cloud-run-tail.log
          fi

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          marker = Path("runs/latest.json")
          payload = json.loads(marker.read_text(encoding="utf-8")) if marker.exists() else {}
          payload.update({
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "status": os.environ["RUN_STATUS"],
              "finished_at": datetime.now(timezone.utc).isoformat(),
          })
          marker.parent.mkdir(parents=True, exist_ok=True)
          marker.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          Path("results/latest/run.json").write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/latest.json results/latest
          git commit -m "results: Modal MoE scout run ${GITHUB_RUN_ID} (${RUN_STATUS})" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload full results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olmoe-l7-scout-${{ github.run_id }}
          path: |
            modal_moe_experiment/results/olmoe_l7_scout
            modal_moe_experiment/cloud-run.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
