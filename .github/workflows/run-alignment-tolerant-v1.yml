name: Finalize alignment-tolerant v1 integration

# Retriggered after GitHub registered the finalized workflow definition.
on:
  push:
    branches:
      - agent/alignment-tolerant-v1
    paths:
      - ".github/workflows/run-alignment-tolerant-v1.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      TW_OUT: results/pre-qwen-teacher-width-fresh/v1
      ALIGN_OUT: results/pre-qwen-alignment-tolerant/v1
      RUN_DIR: runs/alignment-tolerant/v1/integration-validation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install controlled CPU environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3"
          python -m pip install "numpy>=2.0" "PyYAML>=6.0" "pytest>=8.0"
      - name: Repair teacher-width evidence and validate integration
        id: validation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUN_DIR"
          mkdir -p "$RUN_DIR"
          python -m compileall -q pre_qwen_certification scripts
          PYTHONPATH=. pytest -q \
            tests/test_alignment_tolerant.py \
            tests/test_teacher_width_fresh.py \
            tests/test_teacher_width_result_layout.py \
            tests/test_modal.py \
            tests/test_metrics.py \
            2>&1 | tee "$RUN_DIR/pytest.log"

          PYTHONPATH=. python scripts/aggregate_teacher_width_fresh.py \
            --config configs/pre_qwen_teacher_width_fresh_v1.yaml \
            --output-dir "$TW_OUT" \
            2>&1 | tee "$RUN_DIR/teacher-width-aggregate-provisional.log"
          PYTHONPATH=. python scripts/audit_teacher_width_fresh.py \
            --config configs/pre_qwen_teacher_width_fresh_v1.yaml \
            --output-dir "$TW_OUT" \
            2>&1 | tee "$RUN_DIR/teacher-width-audit-provisional.log"
          PYTHONPATH=. python scripts/aggregate_teacher_width_fresh.py \
            --config configs/pre_qwen_teacher_width_fresh_v1.yaml \
            --output-dir "$TW_OUT" \
            --audit-path "$TW_OUT/adversarial-audit/audit.json" \
            2>&1 | tee "$RUN_DIR/teacher-width-aggregate-final.log"
          PYTHONPATH=. python scripts/audit_teacher_width_fresh.py \
            --config configs/pre_qwen_teacher_width_fresh_v1.yaml \
            --output-dir "$TW_OUT" \
            2>&1 | tee "$RUN_DIR/teacher-width-audit-final.log"
          PYTHONPATH=. python scripts/aggregate_teacher_width_fresh.py \
            --config configs/pre_qwen_teacher_width_fresh_v1.yaml \
            --output-dir "$TW_OUT" \
            --audit-path "$TW_OUT/adversarial-audit/audit.json" \
            > "$RUN_DIR/teacher-width-aggregate-confirmed.log" 2>&1

          find "$TW_OUT" -type f ! -name sha256sums.txt -print0 \
            | sort -z | xargs -0 sha256sum > "$TW_OUT/sha256sums.txt"
          sha256sum -c "$TW_OUT/sha256sums.txt" \
            2>&1 | tee "$RUN_DIR/teacher-width-sha256.log"
          sha256sum -c "$ALIGN_OUT/sha256sums.txt" \
            2>&1 | tee "$RUN_DIR/alignment-v1-sha256.log"
          echo "470b1b04801bbe2d163016ef593b553fe43dc3dd2274c26b7a732bcdcb2357fd  docs/HANDOFF_MODAL_MOE_RESEARCH_2026-07-28_FULL.md" \
            | sha256sum -c - | tee "$RUN_DIR/handoff-sha256.log"

          rm -rf /tmp/teacher-width-audit /tmp/alignment-v1-audit
          cp -a "$TW_OUT" /tmp/teacher-width-audit
          PYTHONPATH=. python scripts/audit_teacher_width_fresh.py \
            --config configs/pre_qwen_teacher_width_fresh_v1.yaml \
            --output-dir /tmp/teacher-width-audit \
            2>&1 | tee "$RUN_DIR/teacher-width-independent-audit.log"
          cp -a "$ALIGN_OUT" /tmp/alignment-v1-audit
          PYTHONPATH=. python scripts/audit_alignment_tolerant.py \
            --config configs/pre_qwen_alignment_tolerant_v1.yaml \
            --output-dir /tmp/alignment-v1-audit \
            2>&1 | tee "$RUN_DIR/alignment-v1-independent-audit.log"

          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          for path in (
              'results/PRE_QWEN_GATE_STATUS.json',
              'docs/methodology/IMPORTANT_CLAIM_LEDGER.json',
              'results/pre-qwen-teacher-width-fresh/v1/metrics.json',
              'results/pre-qwen-teacher-width-fresh/v1/adversarial-audit/audit.json',
              'results/pre-qwen-alignment-tolerant/v1/metrics.json',
              'results/pre-qwen-alignment-tolerant/v1/adversarial-audit/audit.json',
          ):
              json.loads(Path(path).read_text(encoding='utf-8'))
          payload = {
              'status': 'PASS',
              'source_sha': os.environ.get('GITHUB_SHA'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'teacher_width_layout': 'canonical_nested_seed_directories',
              'teacher_width_audit': 'PASS',
              'alignment_v1_audit': 'PASS',
              'handoff_sha256': '470b1b04801bbe2d163016ef593b553fe43dc3dd2274c26b7a732bcdcb2357fd',
              'recorded_at': datetime.now(timezone.utc).isoformat(),
          }
          Path(os.environ['RUN_DIR']).joinpath('validation.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
      - name: Persist finalized evidence
        if: always()
        shell: bash
        env:
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        run: |
          set -euo pipefail
          if [[ "$VALIDATION_OUTCOME" != "success" ]]; then
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path(os.environ['RUN_DIR']) / 'validation.json'
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({
              'status': 'FAIL',
              'source_sha': os.environ.get('GITHUB_SHA'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'recorded_at': datetime.now(timezone.utc).isoformat(),
          }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          fi
          rm -f .github/workflows/run-alignment-tolerant-v1.yml
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A "$TW_OUT" "$RUN_DIR" .github/workflows/run-alignment-tolerant-v1.yml
          git commit -m "test: finalize audited alignment-tolerant v1 integration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Fail after persisting diagnostics
        if: steps.validation.outcome != 'success'
        shell: bash
        run: exit 1
