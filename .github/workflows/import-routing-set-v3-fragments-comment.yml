name: Import fragmented routing-set v3 by comment

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: import-routing-set-v3-fragments-comment
  cancel-in-progress: false

env:
  TARGET_BRANCH: agent/alignment-routing-set-distill-v3
  ARCHIVE_SHA256: 52daa0765d5b686371fae5abb11414668410f144e47529c196bb3c6eec3c5c04
  ARCHIVE_BYTES: "21776"

jobs:
  import:
    if: >-
      github.actor == 'rornellas' &&
      github.event.issue.pull_request &&
      github.event.comment.body == '/import-routing-set-v3-fragments'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct and verify fragmented bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .github/import/routing-set-v3 -name 'part-*.b64' | wc -l)" -eq 8
          cat .github/import/routing-set-v3/part-*.b64 | base64 --decode > /tmp/routing-set-v3.tar.xz
          [[ "$(stat -c %s /tmp/routing-set-v3.tar.xz)" == "$ARCHIVE_BYTES" ]]
          echo "$ARCHIVE_SHA256  /tmp/routing-set-v3.tar.xz" | sha256sum -c -
          xz --test /tmp/routing-set-v3.tar.xz
          tar -xJf /tmp/routing-set-v3.tar.xz -C "$GITHUB_WORKSPACE"
      - name: Validate readable source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3"
          python -m pip install "numpy>=2.0" "PyYAML>=6.0" "pytest>=8.0"
          python -m compileall -q pre_qwen_certification scripts tests
          PYTHONPATH=. pytest -q
      - name: Persist readable source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/import/routing-set-v3
          mkdir -p runs/alignment-routing-set-v3
          printf '{"run_id":%s,"status":"source-import-success"}\n' "$GITHUB_RUN_ID" > runs/alignment-routing-set-v3/source-import-status.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "experiment: preregister readable routing-set distillation v3"
          git push origin "HEAD:${TARGET_BRANCH}"
      - name: Persist failure marker
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          mkdir -p runs/alignment-routing-set-v3
          printf '{"run_id":%s,"status":"source-import-failure"}\n' "$GITHUB_RUN_ID" > runs/alignment-routing-set-v3/source-import-status.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runs/alignment-routing-set-v3/source-import-status.json
          git commit -m "diagnostics: record routing-set v3 source import failure"
          git push origin "HEAD:${TARGET_BRANCH}"
