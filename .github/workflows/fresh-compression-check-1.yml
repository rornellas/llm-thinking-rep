name: Fresh Compression Check 1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fresh-compression-check-1.yml']
permissions:
  contents: write
concurrency:
  group: fresh-compression-check-1
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned data and preflight dependencies
        run: |
          python -m pip install datasets==5.0.1 tokenizers==0.23.1 numpy==2.3.5 scipy==1.17.0 pytest==8.4.2
      - name: Test parsing and uncertainty before any fresh model evaluation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs/fresh-compression-check-1
          PYTHONPATH=. pytest -q tests/test_fresh_compression_check.py 2>&1 | tee runs/fresh-compression-check-1/preflight.log
      - name: Prepare true-article data and prove parent-prefix separation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_fresh_compression_check_1.py 2>&1 | tee runs/fresh-compression-check-1/data-preparation.log
          test -f data/fresh-compression-check-1/manifest.json
          git diff --exit-code -- scripts tests configs docs/prereg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fcc1-data
          path: |
            data/fresh-compression-check-1
            runs/fresh-compression-check-1
          retention-days: 30
          if-no-files-found: warn
  cell:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        index: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: fcc1-data
          path: .
      - name: Install pinned evaluation dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install numpy==2.3.5 scipy==1.17.0 PyYAML==6.0.3
      - name: Evaluate the fixed candidate and controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/fresh-compression-check-1
          python scripts/run_fresh_compression_check_1.py --index ${{ matrix.index }} 2>&1 | tee results/fresh-compression-check-1/cell-${{ matrix.index }}.log
          git diff --exit-code -- scripts pre_qwen_certification tests configs docs/prereg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fcc1-cell-${{ matrix.index }}
          path: |
            results/fresh-compression-check-1/cell-${{ matrix.index }}.json
            results/fresh-compression-check-1/cell-${{ matrix.index }}.log
          retention-days: 30
          if-no-files-found: warn
  aggregate:
    needs: [prepare, cell]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: fcc1-data
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: fcc1-cell-*
          merge-multiple: true
          path: results/fresh-compression-check-1
      - name: Independent article statistics, resampling arithmetic and duplicate exclusion
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python scripts/aggregate_fresh_compression_check_1.py 2>&1 | tee runs/fresh-compression-check-1/aggregation.log
          sha256sum -c results/fresh-compression-check-1/SHA256SUMS
          git rev-parse HEAD > runs/fresh-compression-check-1/source-commit.txt
          sha256sum docs/prereg/FRESH_COMPRESSION_CHECK_1.md scripts/prepare_fresh_compression_check_1.py scripts/run_fresh_compression_check_1.py scripts/aggregate_fresh_compression_check_1.py > runs/fresh-compression-check-1/SOURCE_SHA256SUMS
      - name: Commit all fresh evidence without force or resampling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/fresh-compression-check-1 results/fresh-compression-check-1 runs/fresh-compression-check-1 docs/results/2026-09-04-fresh-compression-check-1.md
          git commit -m 'results: record fresh article compression confirmation and crossed audit'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fcc1-complete
          path: |
            data/fresh-compression-check-1
            results/fresh-compression-check-1
            runs/fresh-compression-check-1
            docs/results/2026-09-04-fresh-compression-check-1.md
            docs/prereg/FRESH_COMPRESSION_CHECK_1.md
            scripts/prepare_fresh_compression_check_1.py
            scripts/run_fresh_compression_check_1.py
            scripts/aggregate_fresh_compression_check_1.py
            tests/test_fresh_compression_check.py
          retention-days: 30
          if-no-files-found: warn
