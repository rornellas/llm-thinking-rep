name: Modal MoE — Test 2.3 functional distillation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-2-3-functional-distillation.yml"

permissions:
  contents: write

concurrency:
  group: modal-moe-test-2-3-distillation
  cancel-in-progress: true

jobs:
  distillation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      NUMEXPR_NUM_THREADS: "4"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu "torch>=2.3"
          python -m pip install --no-cache-dir "numpy>=2.0"

      - name: Materialize pinned Tiny Shakespeare
        run: |
          mkdir -p data
          python - <<'PY'
          import base64, json, urllib.request
          from pathlib import Path
          sha="7dcb3a2d4cc3b48b6283dd46870bfeb78f88aac9"
          req=urllib.request.Request(f"https://api.github.com/repos/karpathy/char-rnn/git/blobs/{sha}",headers={"Accept":"application/vnd.github+json","User-Agent":"modal-moe-experiment"})
          with urllib.request.urlopen(req,timeout=60) as response: payload=json.load(response)
          Path("data/tinyshakespeare.txt").write_bytes(base64.b64decode(payload["content"]))
          PY

      - name: Validate distillation machinery
        run: |
          python experiments/test_2_0_modal_moe_trainability.py --self-test
          python experiments/test_2_3_functional_modal_distillation.py \
            --source experiments/test_2_0_modal_moe_trainability.py \
            --text data/tinyshakespeare.txt \
            --self-test

      - name: Train teacher and distill modal students
        run: |
          python experiments/test_2_3_functional_modal_distillation.py \
            --source experiments/test_2_0_modal_moe_trainability.py \
            --text data/tinyshakespeare.txt \
            --output-dir results/test-2-3/latest \
            --teacher-steps 400 \
            --distill-steps 500 \
            --seed 1337 \
            --threads 4 \
            2>&1 | tee functional-distillation.log

      - name: Publish verdict
        if: always()
        run: |
          [[ -f results/test-2-3/latest/VERDICT.md ]] && cat results/test-2-3/latest/VERDICT.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Persist results
        if: always()
        env:
          RUN_STATUS: ${{ job.status }}
        run: |
          mkdir -p results/test-2-3/latest runs
          [[ -f functional-distillation.log ]] && cp functional-distillation.log results/test-2-3/latest/
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          payload={"workflow":"Modal MoE — Test 2.3 functional distillation","run_id":int(os.environ["GITHUB_RUN_ID"]),"status":os.environ["RUN_STATUS"],"finished_at":datetime.now(timezone.utc).isoformat()}
          Path("runs/test-2-3-latest.json").write_text(json.dumps(payload,indent=2)+"\n")
          Path("results/test-2-3/latest/run.json").write_text(json.dumps(payload,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/test-2-3/latest runs/test-2-3-latest.json
          git commit -m "results: functional distillation ${GITHUB_RUN_ID} (${RUN_STATUS})" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modal-moe-test-2-3-distillation-${{ github.run_id }}
          path: |
            results/test-2-3/latest
            functional-distillation.log
          if-no-files-found: warn
          retention-days: 14

