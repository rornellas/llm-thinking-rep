name: Hardware proxy — Test 6.0 event-delta refinement

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-6-0-event-delta-refinement.yml"

permissions:
  contents: write

concurrency:
  group: hardware-proxy-test-6-0-event-delta
  cancel-in-progress: false

jobs:
  event-delta-refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      NUMEXPR_NUM_THREADS: "4"

    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Register run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "workflow": "Hardware proxy — Test 6.0 event-delta refinement",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "status": "running",
              "commit": os.environ["GITHUB_SHA"],
              "started_at": datetime.now(timezone.utc).isoformat(),
          }
          Path("runs/test-6-0-latest.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/test-6-0-latest.json
          git commit -m "chore: register Test 6.0 run ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu "torch>=2.3"
          python -m pip install --no-cache-dir "numpy>=2.0"

      - name: Materialize pinned Tiny Shakespeare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python - <<'PY'
          import base64
          import json
          import urllib.request
          from pathlib import Path

          blob_sha = "7dcb3a2d4cc3b48b6283dd46870bfeb78f88aac9"
          request = urllib.request.Request(
              f"https://api.github.com/repos/karpathy/char-rnn/git/blobs/{blob_sha}",
              headers={"Accept": "application/vnd.github+json", "User-Agent": "modal-moe-experiment"},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = json.load(response)
          if payload.get("sha") != blob_sha or payload.get("encoding") != "base64":
              raise RuntimeError(payload)
          Path("data/tinyshakespeare.txt").write_bytes(base64.b64decode(payload["content"]))
          PY
          test -s data/tinyshakespeare.txt

      - name: Validate event algebra
        shell: bash
        run: |
          set -euo pipefail
          python experiments/test_6_0_event_delta_refinement.py \
            --source experiments/test_2_0_modal_moe_trainability.py \
            --progressive-source experiments/test_2_6_progressive_nested_modes.py \
            --text data/tinyshakespeare.txt \
            --self-test
          python -m py_compile experiments/test_6_0_event_delta_refinement.py

      - name: Train progressive model and test event deltas
        shell: bash
        run: |
          set -euo pipefail
          python experiments/test_6_0_event_delta_refinement.py \
            --source experiments/test_2_0_modal_moe_trainability.py \
            --progressive-source experiments/test_2_6_progressive_nested_modes.py \
            --text data/tinyshakespeare.txt \
            --output-dir results/test-6-0/latest \
            --seed 60600 \
            --steps 400 \
            --threads 4 \
            --calibration-batches 16 \
            --test-batches 24 \
            2>&1 | tee test-6-0.log

      - name: Publish verdict
        if: always()
        shell: bash
        run: |
          [[ -f results/test-6-0/latest/VERDICT.md ]] && cat results/test-6-0/latest/VERDICT.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Persist result
        if: always()
        shell: bash
        env:
          RUN_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p results/test-6-0/latest runs
          [[ -f test-6-0.log ]] && cp test-6-0.log results/test-6-0/latest/
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          marker = Path("runs/test-6-0-latest.json")
          payload = json.loads(marker.read_text(encoding="utf-8")) if marker.exists() else {}
          payload.update({
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "status": os.environ["RUN_STATUS"],
              "finished_at": datetime.now(timezone.utc).isoformat(),
          })
          marker.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          Path("results/test-6-0/latest/run.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/test-6-0-latest.json results/test-6-0/latest
          git commit -m "results: Test 6.0 ${GITHUB_RUN_ID} (${RUN_STATUS})" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-proxy-test-6-0-${{ github.run_id }}
          path: |
            results/test-6-0/latest
            test-6-0.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9
