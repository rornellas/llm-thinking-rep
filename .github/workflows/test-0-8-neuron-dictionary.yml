name: Modal MoE — Test 0.8 neuron dictionary

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-0-8-neuron-dictionary.yml"

permissions:
  contents: write

concurrency:
  group: modal-moe-test-0-8-neuron-dictionary
  cancel-in-progress: true

jobs:
  neuron-dictionary:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      NUMEXPR_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_XET: "1"

    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Register workflow run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          payload = {
              "workflow": "Modal MoE — Test 0.8 neuron dictionary",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "status": "running",
              "commit": os.environ["GITHUB_SHA"],
              "started_at": datetime.now(timezone.utc).isoformat(),
          }
          Path("runs/test-0-8-latest.json").write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/test-0-8-latest.json
          git commit -m "chore: register neuron-dictionary run ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild experiment package
        shell: bash
        run: |
          set -euo pipefail
          cat experiment/archive.part-* | base64 --decode > "$RUNNER_TEMP/modal_moe_experiment.zip"
          echo "363c296bac175dfb71a7594777e5239d3363ab045b3b5700737b4cf88ac4a323  $RUNNER_TEMP/modal_moe_experiment.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/modal_moe_experiment.zip"
          cp experiments/test_0_8_neuron_dictionary_probe.py modal_moe_experiment/neuron_dictionary_probe.py
          test -f modal_moe_experiment/neuron_dictionary_probe.py

      - name: Install CPU-only dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu "torch>=2.3"
          python -m pip install --no-cache-dir \
            "numpy>=2.0" "requests>=2.31" "safetensors>=0.4.3" \
            "pytest>=8.0" "huggingface_hub>=0.24"

      - name: Validate mathematical implementation
        working-directory: modal_moe_experiment
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q
          python neuron_dictionary_probe.py --self-test

      - name: Run real cross-expert dictionary screen
        working-directory: modal_moe_experiment
        shell: bash
        env:
          RANGE_CACHE: ${{ runner.temp }}/olmoe-neuron-range-cache
        run: |
          set -euo pipefail
          python neuron_dictionary_probe.py \
            --layer 7 \
            --train-dims 48 \
            --holdout-dims 96 \
            --queries-per-expert 8 \
            --top-n 64 \
            --batch-size 8 \
            --seed 20260729 \
            --top-k 8 \
            --cache-dir "$RANGE_CACHE" \
            --output-dir "${GITHUB_WORKSPACE}/modal_moe_experiment/results/test_0_8/latest" \
            2>&1 | tee neuron-dictionary.log

      - name: Publish verdict in run summary
        if: always()
        shell: bash
        run: |
          verdict="modal_moe_experiment/results/test_0_8/latest/VERDICT.md"
          if [[ -f "$verdict" ]]; then
            cat "$verdict" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' '## Test 0.8' '' 'No verdict was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Persist compact result in repository
        if: always()
        shell: bash
        env:
          RUN_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          rm -rf results/test-0-8/latest
          mkdir -p results/test-0-8/latest
          if [[ -d modal_moe_experiment/results/test_0_8/latest ]]; then
            cp -a modal_moe_experiment/results/test_0_8/latest/. results/test-0-8/latest/
          fi
          if [[ -f modal_moe_experiment/neuron-dictionary.log ]]; then
            cp modal_moe_experiment/neuron-dictionary.log results/test-0-8/latest/
          fi
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          marker = Path("runs/test-0-8-latest.json")
          payload = json.loads(marker.read_text(encoding="utf-8")) if marker.exists() else {}
          payload.update({
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "status": os.environ["RUN_STATUS"],
              "finished_at": datetime.now(timezone.utc).isoformat(),
          })
          marker.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          Path("results/test-0-8/latest/run.json").write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/test-0-8-latest.json results/test-0-8/latest
          git commit -m "results: neuron-dictionary run ${GITHUB_RUN_ID} (${RUN_STATUS})" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload full results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olmoe-test-0-8-neuron-dictionary-${{ github.run_id }}
          path: |
            modal_moe_experiment/results/test_0_8/latest
            modal_moe_experiment/neuron-dictionary.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9
