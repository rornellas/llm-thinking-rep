name: Representation — Test 5.0c adaptive byte units corrected

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-5-0c-adaptive-byte-units-corrected.yml"

permissions:
  contents: write

concurrency:
  group: representation-test-5-0c-adaptive-byte-units
  cancel-in-progress: false

jobs:
  adaptive-byte-units:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      NUMEXPR_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_XET: "1"
      HF_HOME: /tmp/huggingface

    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Register run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          payload = {
              "workflow": "Test 5.0c adaptive byte units corrected",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "status": "running",
              "commit": os.environ["GITHUB_SHA"],
              "started_at": datetime.now(timezone.utc).isoformat(),
          }
          Path("runs/test-5-0c-latest.json").write_text(json.dumps(payload, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/test-5-0c-latest.json
          git commit -m "chore: register Test 5.0c run ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu "torch>=2.3"
          python -m pip install --no-cache-dir "numpy>=2.0" "datasets>=4.0" "tokenizers>=0.20"

      - name: Materialize WikiText-2 as raw UTF-8 bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/test-5-0c results/test-5-0c/latest
          python - <<'PY'
          import json
          from pathlib import Path
          from datasets import load_dataset

          root = Path("data/test-5-0c")
          dataset = load_dataset("Salesforce/wikitext", "wikitext-2-raw-v1")

          def materialize(split):
              text = "\n".join(row["text"] for row in dataset[split]) + "\n"
              raw = text.encode("utf-8")
              (root / f"{split}.bin").write_bytes(raw)
              return len(raw), len(dataset[split])

          train_bytes, train_rows = materialize("train")
          validation_bytes, validation_rows = materialize("validation")
          stats = {
              "dataset": "Salesforce/wikitext",
              "subset": "wikitext-2-raw-v1",
              "train_bytes": train_bytes,
              "validation_bytes": validation_bytes,
              "train_rows": train_rows,
              "validation_rows": validation_rows,
          }
          Path("results/test-5-0c/latest/dataset_stats.json").write_text(json.dumps(stats, indent=2) + "\n")
          print(json.dumps(stats, indent=2))
          PY
          test -s data/test-5-0c/train.bin
          test -s data/test-5-0c/validation.bin

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          python experiments/test_5_0b_adaptive_byte_units_query_fix.py --self-test
          python -m py_compile \
            experiments/test_5_0_adaptive_byte_units.py \
            experiments/test_5_0b_adaptive_byte_units_query_fix.py

      - name: Compare byte, BPE, fixed, adaptive, and random-matched units
        shell: bash
        run: |
          set -euo pipefail
          python experiments/test_5_0b_adaptive_byte_units_query_fix.py \
            --train-bytes data/test-5-0c/train.bin \
            --validation-bytes data/test-5-0c/validation.bin \
            --output-dir results/test-5-0c/latest \
            --seed 50500 \
            --steps 300 \
            --context-bytes 128 \
            --batch-size 16 \
            --eval-batches 30 \
            --threads 4 \
            2>&1 | tee test-5-0c.log

      - name: Publish verdict
        if: always()
        shell: bash
        run: |
          [[ -f results/test-5-0c/latest/VERDICT.md ]] && cat results/test-5-0c/latest/VERDICT.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Persist result
        if: always()
        shell: bash
        env:
          RUN_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p results/test-5-0c/latest runs
          [[ -f test-5-0c.log ]] && cp test-5-0c.log results/test-5-0c/latest/
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          marker = Path("runs/test-5-0c-latest.json")
          payload = json.loads(marker.read_text()) if marker.exists() else {}
          payload.update({
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "status": os.environ["RUN_STATUS"],
              "finished_at": datetime.now(timezone.utc).isoformat(),
          })
          marker.write_text(json.dumps(payload, indent=2) + "\n")
          Path("results/test-5-0c/latest/run.json").write_text(json.dumps(payload, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/test-5-0c-latest.json results/test-5-0c/latest
          git commit -m "results: Test 5.0c ${GITHUB_RUN_ID} (${RUN_STATUS})" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: representation-test-5-0c-${{ github.run_id }}
          path: |
            results/test-5-0c/latest
            test-5-0c.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9
