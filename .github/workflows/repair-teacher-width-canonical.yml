name: Repair canonical teacher-width result layout

# Retriggered after GitHub registered the workflow definition.
on:
  push:
    branches:
      - agent/alignment-tolerant-v1
    paths:
      - ".github/workflows/repair-teacher-width-canonical.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      OUT: results/pre-qwen-teacher-width-fresh/v1
      RUN_DIR: runs/teacher-width-canonical-repair/v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install controlled CPU environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3"
          python -m pip install "numpy>=2.0" "PyYAML>=6.0" "pytest>=8.0"
      - name: Rebuild aggregate, audit, and manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUN_DIR"
          mkdir -p "$RUN_DIR"
          PYTHONPATH=. pytest -q \
            tests/test_teacher_width_fresh.py \
            tests/test_teacher_width_result_layout.py \
            tests/test_metrics.py \
            2>&1 | tee "$RUN_DIR/pytest.log"
          PYTHONPATH=. python scripts/aggregate_teacher_width_fresh.py \
            --config configs/pre_qwen_teacher_width_fresh_v1.yaml \
            --output-dir "$OUT" \
            2>&1 | tee "$RUN_DIR/aggregate-provisional.log"
          PYTHONPATH=. python scripts/audit_teacher_width_fresh.py \
            --config configs/pre_qwen_teacher_width_fresh_v1.yaml \
            --output-dir "$OUT" \
            2>&1 | tee "$RUN_DIR/audit-provisional.log"
          PYTHONPATH=. python scripts/aggregate_teacher_width_fresh.py \
            --config configs/pre_qwen_teacher_width_fresh_v1.yaml \
            --output-dir "$OUT" \
            --audit-path "$OUT/adversarial-audit/audit.json" \
            2>&1 | tee "$RUN_DIR/aggregate-final.log"
          PYTHONPATH=. python scripts/audit_teacher_width_fresh.py \
            --config configs/pre_qwen_teacher_width_fresh_v1.yaml \
            --output-dir "$OUT" \
            2>&1 | tee "$RUN_DIR/audit-final.log"
          PYTHONPATH=. python scripts/aggregate_teacher_width_fresh.py \
            --config configs/pre_qwen_teacher_width_fresh_v1.yaml \
            --output-dir "$OUT" \
            --audit-path "$OUT/adversarial-audit/audit.json" \
            > "$RUN_DIR/aggregate-confirmed.log" 2>&1
          find "$OUT" -type f ! -name sha256sums.txt -print0 \
            | sort -z | xargs -0 sha256sum > "$OUT/sha256sums.txt"
          sha256sum -c "$OUT/sha256sums.txt" \
            2>&1 | tee "$RUN_DIR/sha256-check.log"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          payload = {
              'status': 'PASS',
              'source_sha': os.environ.get('GITHUB_SHA'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'canonical_layout': 'nested_seed_directories',
              'recorded_at': datetime.now(timezone.utc).isoformat(),
          }
          Path(os.environ['RUN_DIR']).joinpath('repair.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
      - name: Persist repaired canonical evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-teacher-width-canonical.yml
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A "$OUT" "$RUN_DIR" .github/workflows/repair-teacher-width-canonical.yml
          git commit -m "results: repair canonical teacher-width nested artifact layout"
          git push origin "HEAD:${GITHUB_REF_NAME}"
