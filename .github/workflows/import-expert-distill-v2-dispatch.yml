name: Import expert-distillation v2 into experiment branch

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: import-expert-distill-v2-dispatch
  cancel-in-progress: false

jobs:
  import-source:
    if: >-
      github.actor == 'rornellas' &&
      github.event.issue.pull_request &&
      github.event.comment.body == '/import-expert-distill-v2-readable'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_BRANCH: agent/alignment-tolerant-expert-distill-v2
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify and reconstruct source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/expert-distill-v2-fragments.sha256 <<'EOF'
          5f24da9ee9c28ceb7f9c5a07cbb3535e7704d4b093510ec57ce013e09a7b506a  .github/import/expert-distill-v2-source/part-00.b64
          19dd646bf5eb0f62ad53603726ba720ccde11f35a86d3985334000f1b1d464e1  .github/import/expert-distill-v2-source/part-01.b64
          6bca5a1b6b2b113daa3dbaea2a9a73ec8c62f5e519b1d1408a94afef930eb4bd  .github/import/expert-distill-v2-source/part-02.b64
          15c02b85d21a6ae803008c49e05b384a09490a4ae22a4e7b3f4fb9fafe73d64d  .github/import/expert-distill-v2-source/part-03.b64
          f27f172758ca62302c89b36228c45aef459d52590cdb49ce253261f97a9c2587  .github/import/expert-distill-v2-source/part-04.b64
          EOF
          sha256sum -c /tmp/expert-distill-v2-fragments.sha256
          cat .github/import/expert-distill-v2-source/part-*.b64 | base64 --decode > /tmp/expert-distill-v2-source.tar.xz
          echo "29c7ff8654c3c3b2bf4b2cea2104860d61061f68f8940cbe2cfb380eeeccb7e0  /tmp/expert-distill-v2-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/expert-distill-v2-source.tar.xz -C "$GITHUB_WORKSPACE"
      - name: Validate preregistered source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3"
          python -m pip install "numpy>=2.0" "PyYAML>=6.0" "pytest>=8.0"
          python -m compileall -q pre_qwen_certification scripts tests
          PYTHONPATH=. pytest -q \
            tests/test_expert_distillation_v2.py \
            tests/test_alignment_tolerant.py \
            tests/test_teacher_width_result_layout.py \
            tests/test_modal.py \
            tests/test_metrics.py
      - name: Persist readable source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/import/expert-distill-v2-source
          rm -f .github/import-expert-distill-v2-readable.trigger
          rm -f .github/workflows/import-expert-distill-v2-readable.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "experiment: import readable alignment expert-distillation v2 source"
          git push origin "HEAD:${TARGET_BRANCH}"
