name: Finalize Native Compact Gate 2A

on:
  push:
    branches: [main]
    paths:
      - ".github/triggers/finalize-native-compact-gate-2a.txt"

permissions:
  actions: read
  contents: write

env:
  SCIENTIFIC_RUN_ID: "31021913119"
  CONFIG: configs/native_compact_gate_2a.yaml
  DATA_ROOT: data/native-compact-gate-2a
  OUTPUT: results/native-compact-gate-2a
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONPYCACHEPREFIX: /tmp/native-compact-finalize-pycache
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  NUMEXPR_NUM_THREADS: "2"

concurrency:
  group: finalize-native-compact-gate-2a
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download frozen data
        uses: actions/download-artifact@v4
        with:
          name: native-compact-gate-2a-data
          path: data/native-compact-gate-2a
          repository: ${{ github.repository }}
          run-id: ${{ env.SCIENTIFIC_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Download frozen small cells
        uses: actions/download-artifact@v4
        with:
          pattern: native-compact-gate-2a-small-*
          path: .
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ env.SCIENTIFIC_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Download frozen medium cells
        uses: actions/download-artifact@v4
        with:
          pattern: native-compact-gate-2a-medium-*
          path: .
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ env.SCIENTIFIC_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Install aggregation and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3"
          python -m pip install "numpy>=2.0,<3" "PyYAML>=6.0,<7" "pytest>=8.0,<9"
      - name: Verify fix, aggregate, audit independently, and finalize
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q pre_qwen_certification scripts tests
          PYTHONPATH=. pytest -q tests/test_native_compact_paired_aggregation.py tests/test_native_compact.py tests/test_native_compact_protocol.py
          python scripts/aggregate_native_compact_gate_2a.py \
            --config "$CONFIG" --output-dir "$OUTPUT"
          python scripts/audit_native_compact_gate_2a.py \
            --config "$CONFIG" --output-dir "$OUTPUT" --data-root "$DATA_ROOT"
          python scripts/aggregate_native_compact_gate_2a.py \
            --config "$CONFIG" --output-dir "$OUTPUT" \
            --audit-path "$OUTPUT/adversarial-audit/audit.json"
          python - <<'PY'
          from pathlib import Path
          import json, os
          root = Path(os.environ['OUTPUT'])
          metrics = json.loads((root / 'metrics.json').read_text())
          audit = json.loads((root / 'adversarial-audit/audit.json').read_text())
          assert audit['audit_passed'] is True
          assert metrics['decision']['gates']['independent_audit'] is True
          assert metrics['decision']['verdict'] == audit['expected_final_verdict_if_audit_passes']
          PY
      - name: Record environment and integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs/native-compact-gate-2a artifacts/2026-08-05/native-compact-gate-2a
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, platform, subprocess, sys
          import numpy, torch, yaml
          config = Path(os.environ['CONFIG'])
          data_manifest = Path(os.environ['DATA_ROOT']) / 'manifest.json'
          metrics = json.loads((Path(os.environ['OUTPUT']) / 'metrics.json').read_text())
          aggregation_commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          payload = {
              'python': sys.version,
              'platform': platform.platform(),
              'torch': torch.__version__,
              'numpy': numpy.__version__,
              'protocol_version': yaml.safe_load(config.read_text())['protocol_version'],
              'scientific_run_id': int(os.environ['SCIENTIFIC_RUN_ID']),
              'scientific_source_commit': metrics['source_commit'],
              'finalize_workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'aggregation_source_commit': aggregation_commit,
              'configuration_sha256': hashlib.sha256(config.read_bytes()).hexdigest(),
              'data_manifest_sha256': hashlib.sha256(data_manifest.read_bytes()).hexdigest(),
          }
          root = Path('runs/native-compact-gate-2a')
          (root / 'environment.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          (root / 'aggregation-fix.json').write_text(json.dumps({
              'scientific_run_id': int(os.environ['SCIENTIFIC_RUN_ID']),
              'reason': 'duplicate chunk-local window coordinates within the same OOD article',
              'resolution': 'pair after averaging within the preregistered seed-by-article statistical unit',
              'scientific_cells_reused_without_retraining': True,
              'aggregation_source_commit': aggregation_commit,
          }, indent=2, sort_keys=True) + '\n')
          (root / 'latest-workflow-status.json').write_text(json.dumps({
              'scientific_run_id': int(os.environ['SCIENTIFIC_RUN_ID']),
              'finalize_run_id': int(os.environ['GITHUB_RUN_ID']),
              'status': 'success',
          }, sort_keys=True) + '\n')
          PY
          find "$DATA_ROOT" "$OUTPUT" runs/native-compact-gate-2a \
            docs/results/2026-08-05-native-compact-gate-2a-analysis.md \
            -type f -print0 | sort -z | xargs -0 sha256sum \
            > artifacts/2026-08-05/native-compact-gate-2a/SHA256SUMS
          sha256sum -c artifacts/2026-08-05/native-compact-gate-2a/SHA256SUMS
      - name: Commit audited scientific artifacts directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "results: record audited Native Compact Gate 2A"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-compact-gate-2a-finalized
          path: |
            data/native-compact-gate-2a
            results/native-compact-gate-2a
            runs/native-compact-gate-2a
            artifacts/2026-08-05/native-compact-gate-2a
            docs/results/2026-08-05-native-compact-gate-2a-analysis.md
          if-no-files-found: warn
          retention-days: 30
