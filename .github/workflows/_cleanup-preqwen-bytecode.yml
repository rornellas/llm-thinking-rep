name: Remove generated Python bytecode

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/_cleanup-preqwen-bytecode.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Remove generated files and commit
        shell: bash
        run: |
          set -euo pipefail
          find pre_qwen_certification tests -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -f .github/workflows/_cleanup-preqwen-bytecode.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove generated Python bytecode"
          git push origin "HEAD:${{ github.head_ref }}"
