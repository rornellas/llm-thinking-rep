name: Validate routing-coupled residual v4

on:
  push:
    branches: [main]
    paths:
      - ".github/triggers/validate-routing-coupled-v4.txt"

permissions:
  contents: write

concurrency:
  group: validate-routing-coupled-v4
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TARGET_BRANCH: agent/routing-coupled-residual-v4
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3"
          python -m pip install "numpy>=2.0" "PyYAML>=6.0" "pytest>=8.0"
      - name: Compile and test complete frozen source
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q pre_qwen_certification scripts tests
          PYTHONPATH=. pytest -q
          python - <<'PY'
          from pathlib import Path
          import yaml
          c=yaml.safe_load(Path('configs/pre_qwen_routing_coupled_v4.yaml').read_text())
          assert c['protocol_version']=='pre-qwen-routing-coupled-residual-v4'
          assert c['status']=='preregistered_before_materializing_v4_hypothesis_or_ood'
          assert c['seeds']==[91121,92129,93133,94151,95153]
          assert abs(sum(map(float,c['objective'].values()))-1.0)<1e-9
          assert abs(sum(map(float,c['training']['joint_weights'].values()))-1.0)<1e-9
          assert c['gates']['behavior_improvement_min_votes']==2
          expected={row['name']:(float(row['expected_parameter_ratio']),float(row['expected_compute_ratio'])) for row in c['candidates']}
          assert expected['rank5-coupled-q8-h8-v4']==(0.4428240740740741,0.625)
          assert expected['rank5-coupled-q12-h8-v4']==(0.453125,0.6375)
          PY
      - name: Persist validation result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          mkdir -p runs/routing-coupled-v4
          if [[ "${{ job.status }}" == "success" ]]; then status=PASS; else status=FAIL; fi
          printf '{"run_id":%s,"status":"%s","source_commit":"%s"}\n' "$GITHUB_RUN_ID" "$status" "$(git rev-parse HEAD)" > runs/routing-coupled-v4/mechanism-validation.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runs/routing-coupled-v4/mechanism-validation.json
          git commit -m "test: record routing-coupled v4 mechanism validation"
          git push origin "HEAD:${TARGET_BRANCH}"
