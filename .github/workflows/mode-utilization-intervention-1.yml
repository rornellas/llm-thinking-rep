name: Mode Utilization Intervention 1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mode-utilization-intervention-1.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mode-utilization-intervention-1
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
jobs:
  cell:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [904031, 904043, 904051, 904073]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install numpy==2.3.5 PyYAML==6.0.3
      - name: Preflight and fixed scientific cell
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q scripts/run_mode_utilization_intervention_1.py
          mkdir -p results/mode-utilization-intervention-1
          python scripts/run_mode_utilization_intervention_1.py --seed ${{ matrix.seed }} \
            2>&1 | tee results/mode-utilization-intervention-1/seed-${{ matrix.seed }}.log
          git diff --exit-code -- pre_qwen_certification scripts configs docs/prereg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mui1-${{ matrix.seed }}
          path: results/mode-utilization-intervention-1
          if-no-files-found: warn
          retention-days: 30
  aggregate:
    needs: cell
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: mui1-*
          merge-multiple: true
          path: results/mode-utilization-intervention-1
      - name: Aggregate with second arithmetic path and checkpoint validation
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python scripts/aggregate_mode_utilization_intervention_1.py
          sha256sum -c results/mode-utilization-intervention-1/SHA256SUMS
      - name: Commit raw results and checkpoints directly to main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/mode-utilization-intervention-1 docs/results/2026-09-04-mode-utilization-intervention-1.md
          git commit -m 'results: preserve four-seed MUI-1 intervention and arithmetic audit'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mui1-complete
          path: |
            results/mode-utilization-intervention-1
            docs/results/2026-09-04-mode-utilization-intervention-1.md
          if-no-files-found: warn
          retention-days: 30
