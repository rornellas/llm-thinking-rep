name: Modal MoE — Test 2.1b robustness retry

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-2-1b-modal-robustness-retry.yml"

permissions:
  contents: write

concurrency:
  group: modal-moe-test-2-1-robustness
  cancel-in-progress: true

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      NUMEXPR_NUM_THREADS: "4"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu "torch>=2.3"
          python -m pip install --no-cache-dir "numpy>=2.0"

      - name: Materialize pinned Tiny Shakespeare
        run: |
          mkdir -p data
          python - <<'PY'
          import base64, json, urllib.request
          from pathlib import Path
          sha = "7dcb3a2d4cc3b48b6283dd46870bfeb78f88aac9"
          req = urllib.request.Request(f"https://api.github.com/repos/karpathy/char-rnn/git/blobs/{sha}", headers={"Accept":"application/vnd.github+json","User-Agent":"modal-moe-experiment"})
          with urllib.request.urlopen(req, timeout=60) as response: payload = json.load(response)
          Path("data/tinyshakespeare.txt").write_bytes(base64.b64decode(payload["content"]))
          PY

      - name: Enable K0 and validate
        run: |
          sed -i 's/if modal_rank < 1:/if modal_rank < 0:/' experiments/test_2_0_modal_moe_trainability.py
          python experiments/test_2_0_modal_moe_trainability.py --self-test
          python -m py_compile experiments/test_2_1_modal_robustness.py

      - name: Run controlled multi-seed comparison
        run: |
          python experiments/test_2_1_modal_robustness.py \
            --source experiments/test_2_0_modal_moe_trainability.py \
            --text data/tinyshakespeare.txt \
            --output-dir results/test-2-1/latest \
            --seeds 1337,2027,31415 \
            --steps 400 \
            --threads 4 \
            2>&1 | tee modal-robustness.log

      - name: Publish verdict
        if: always()
        run: |
          [[ -f results/test-2-1/latest/VERDICT.md ]] && cat results/test-2-1/latest/VERDICT.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Persist results
        if: always()
        env:
          RUN_STATUS: ${{ job.status }}
        run: |
          mkdir -p results/test-2-1/latest runs
          [[ -f modal-robustness.log ]] && cp modal-robustness.log results/test-2-1/latest/
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          payload={"workflow":"Modal MoE — Test 2.1b robustness retry","run_id":int(os.environ["GITHUB_RUN_ID"]),"status":os.environ["RUN_STATUS"],"finished_at":datetime.now(timezone.utc).isoformat()}
          Path("runs/test-2-1-latest.json").write_text(json.dumps(payload,indent=2)+"\n")
          Path("results/test-2-1/latest/run.json").write_text(json.dumps(payload,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/test-2-1/latest runs/test-2-1-latest.json
          git commit -m "results: modal robustness retry ${GITHUB_RUN_ID} (${RUN_STATUS})" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modal-moe-test-2-1b-${{ github.run_id }}
          path: |
            results/test-2-1/latest
            modal-robustness.log
          if-no-files-found: warn
          retention-days: 14

