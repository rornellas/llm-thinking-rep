name: Representation — Test 5.3 compact context dependency

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-5-3-context-dependency.yml"

permissions:
  contents: write

concurrency:
  group: representation-test-5-3-context-dependency
  cancel-in-progress: false

jobs:
  context-dependency:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      NUMEXPR_NUM_THREADS: "4"
      HF_HUB_DISABLE_XET: "1"
      HF_HOME: /tmp/huggingface

    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Register run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "workflow": "Representation — Test 5.3 compact context dependency",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "status": "running",
              "commit": os.environ["GITHUB_SHA"],
              "started_at": datetime.now(timezone.utc).isoformat(),
          }
          Path("runs/test-5-3-latest.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/test-5-3-latest.json
          git commit -m "chore: register Test 5.3 run ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu "torch>=2.3"
          python -m pip install --no-cache-dir "numpy>=2.0" "datasets>=4.0"

      - name: Materialize WikiText-2 raw UTF-8 bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/test-5-3 results/test-5-3/latest
          python - <<'PY'
          import json
          from pathlib import Path
          from datasets import load_dataset

          root = Path("data/test-5-3")
          dataset = load_dataset("Salesforce/wikitext", "wikitext-2-raw-v1")

          def materialize(split):
              text = "\n".join(row["text"] for row in dataset[split]) + "\n"
              raw = text.encode("utf-8")
              (root / f"{split}.bin").write_bytes(raw)
              return len(raw), len(dataset[split])

          train_bytes, train_rows = materialize("train")
          validation_bytes, validation_rows = materialize("validation")
          Path("results/test-5-3/latest/dataset_stats.json").write_text(
              json.dumps(
                  {
                      "dataset": "Salesforce/wikitext",
                      "subset": "wikitext-2-raw-v1",
                      "train_bytes": train_bytes,
                      "validation_bytes": validation_bytes,
                      "train_rows": train_rows,
                      "validation_rows": validation_rows,
                  },
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          PY
          test -s data/test-5-3/train.bin
          test -s data/test-5-3/validation.bin

      - name: Validate intervention implementation
        shell: bash
        run: |
          set -euo pipefail
          python experiments/test_5_3_context_dependency.py \
            --resampler-source experiments/test_5_2_learned_latent_resampler.py \
            --self-test
          python -m py_compile experiments/test_5_3_context_dependency.py

      - name: Train compact models and intervene on context
        shell: bash
        run: |
          set -euo pipefail
          python experiments/test_5_3_context_dependency.py \
            --resampler-source experiments/test_5_2_learned_latent_resampler.py \
            --train-bytes data/test-5-3/train.bin \
            --validation-bytes data/test-5-3/validation.bin \
            --output-dir results/test-5-3/latest \
            --seeds 58301,59402,60503 \
            --steps 1200 \
            --threads 4 \
            2>&1 | tee test-5-3.log

      - name: Publish verdict
        if: always()
        shell: bash
        run: |
          [[ -f results/test-5-3/latest/VERDICT.md ]] && cat results/test-5-3/latest/VERDICT.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Persist result
        if: always()
        shell: bash
        env:
          RUN_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p results/test-5-3/latest runs
          [[ -f test-5-3.log ]] && cp test-5-3.log results/test-5-3/latest/
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          marker = Path("runs/test-5-3-latest.json")
          payload = json.loads(marker.read_text(encoding="utf-8")) if marker.exists() else {}
          payload.update({
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "status": os.environ["RUN_STATUS"],
              "finished_at": datetime.now(timezone.utc).isoformat(),
          })
          marker.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          Path("results/test-5-3/latest/run.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/test-5-3-latest.json results/test-5-3/latest
          git commit -m "results: Test 5.3 ${GITHUB_RUN_ID} (${RUN_STATUS})" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: representation-test-5-3-${{ github.run_id }}
          path: |
            results/test-5-3/latest
            test-5-3.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9
