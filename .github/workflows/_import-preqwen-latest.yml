name: Import audited pre-Qwen research bundle

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/_import-preqwen-latest.yml"
      - ".github/import/preqwen-latest/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-preqwen-latest-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Reconstruct and verify bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .github/import/preqwen-latest/part-*.b64 | base64 -d > /tmp/preqwen-latest.tar.xz
          echo "3b53c763142b8f0cbaadee11a5fad0ece24a0a24fa32dabc777f6dc1793a0143  /tmp/preqwen-latest.tar.xz" | sha256sum -c -
          tar -xJf /tmp/preqwen-latest.tar.xz -C "$GITHUB_WORKSPACE"
          sha256sum -c LATEST_RESEARCH_MANIFEST.sha256
          python -m compileall -q pre_qwen_certification tests

      - name: Commit verified research tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/import/preqwen-latest .github/import/preqwen-curated
          rm -f .github/workflows/_import-preqwen-latest.yml
          rm -f .github/workflows/_export-base-tree.yml BASE_TREE_SHA.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "research: add audited pre-Qwen certification and selective MoE preregistration"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
