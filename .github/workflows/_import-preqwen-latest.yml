name: Diagnose pre-Qwen research bundle

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/_import-preqwen-latest.yml"
      - ".github/import/preqwen-latest/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-preqwen-latest-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Persist reconstruction diagnostics
        shell: bash
        run: |
          set -u
          report=IMPORT_DIAGNOSTIC.txt
          : > "$report"
          find .github/import/preqwen-latest -maxdepth 1 -type f -printf '%f %s bytes\n' | sort >> "$report"
          for file in .github/import/preqwen-latest/part-*.b64; do
            sha256sum "$file" >> "$report"
          done
          cat .github/import/preqwen-latest/part-*.b64 > /tmp/preqwen-latest.b64
          printf 'combined-base64 ' >> "$report"; sha256sum /tmp/preqwen-latest.b64 >> "$report"
          base64 -d /tmp/preqwen-latest.b64 > /tmp/preqwen-latest.tar.xz 2>> "$report"
          printf 'base64_rc=%s\n' "$?" >> "$report"
          printf 'reconstructed-tar ' >> "$report"; sha256sum /tmp/preqwen-latest.tar.xz >> "$report"
          xz -t /tmp/preqwen-latest.tar.xz 2>> "$report"
          printf 'xz_rc=%s\n' "$?" >> "$report"
          cat "$report"

      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IMPORT_DIAGNOSTIC.txt
          git commit -m "ci: persist pre-Qwen import diagnostic" || true
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
