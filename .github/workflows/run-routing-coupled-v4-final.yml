name: Run frozen routing-coupled residual v4 final

on:
  push:
    branches: [main]
    paths:
      - ".github/triggers/run-routing-coupled-v4-final.txt"

permissions:
  contents: write

concurrency:
  group: routing-coupled-residual-v4-final
  cancel-in-progress: false

env:
  TARGET_BRANCH: agent/routing-coupled-residual-v4
  SOURCE_COMMIT: ff8b506be2acea4980adaa524665dbc31db54e5b
  VALIDATED_SOURCE_COMMIT: d98432e377eae3fe6dbbabef7b8d3935dcc22eff
  CONFIG: configs/pre_qwen_routing_coupled_v4.yaml
  OUTPUT: results/pre-qwen-routing-coupled/v4
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3"
          python -m pip install "numpy>=2.0" "PyYAML>=6.0" "pytest>=8.0"
      - name: Verify frozen protocol source and validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python -m compileall -q pre_qwen_certification scripts tests
          PYTHONPATH=. pytest -q
          python - <<'PY'
          from pathlib import Path
          import json, os, yaml
          c=yaml.safe_load(Path(os.environ['CONFIG']).read_text())
          marker=json.loads(Path('runs/routing-coupled-v4/mechanism-validation.json').read_text())
          assert c['protocol_version']=='pre-qwen-routing-coupled-residual-v4'
          assert c['status']=='preregistered_before_materializing_v4_hypothesis_or_ood'
          assert c['seeds']==[91121,92129,93133,94151,95153]
          assert marker['status']=='PASS'
          assert marker['source_commit']==os.environ['VALIDATED_SOURCE_COMMIT']
          assert abs(sum(map(float,c['objective'].values()))-1.0)<1e-9
          assert abs(sum(map(float,c['training']['joint_weights'].values()))-1.0)<1e-9
          assert c['gates']['behavior_improvement_min_votes']==2
          PY

  seed:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed: [91121, 92129, 93133, 94151, 95153]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3"
          python -m pip install "numpy>=2.0" "PyYAML>=6.0"
      - name: Restore immutable checkout
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$SOURCE_COMMIT"
          git clean -fd -e results/ -e runs/ -e artifacts/
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain=v1)"
      - name: Run frozen seed
        shell: bash
        env:
          SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT/logs" runs/routing-coupled-v4
          /usr/bin/time -v python scripts/run_routing_coupled_v4_seed.py \
            --seed "$SEED" \
            --config "$CONFIG" \
            --output-dir "$OUTPUT" \
            2>&1 | tee "$OUTPUT/logs/seed-$SEED.log"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess
          seed=int(os.environ['SEED'])
          root=Path(os.environ['OUTPUT'])
          files=[root/f'seed-{seed}.json',root/f'frozen-candidates-seed-{seed}.pt',root/'logs'/f'seed-{seed}.log']
          payload={'seed':seed,'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':[]}
          for path in files:
              payload['files'].append({'path':str(path),'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()})
          Path(f'runs/routing-coupled-v4/seed-{seed}-manifest.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routing-coupled-v4-final-seed-${{ matrix.seed }}
          path: |
            results/pre-qwen-routing-coupled/v4/seed-${{ matrix.seed }}.json
            results/pre-qwen-routing-coupled/v4/frozen-candidates-seed-${{ matrix.seed }}.pt
            results/pre-qwen-routing-coupled/v4/logs/seed-${{ matrix.seed }}.log
            runs/routing-coupled-v4/seed-${{ matrix.seed }}-manifest.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: seed
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: routing-coupled-v4-final-seed-*
          path: .
          merge-multiple: true
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3"
          python -m pip install "numpy>=2.0" "PyYAML>=6.0" "pytest>=8.0"
      - name: Aggregate provisionally, audit independently, and finalize
        shell: bash
        run: |
          set -euo pipefail
          python scripts/aggregate_routing_coupled_v4.py --config "$CONFIG" --output-dir "$OUTPUT"
          python scripts/audit_routing_coupled_v4.py --config "$CONFIG" --output-dir "$OUTPUT"
          python scripts/aggregate_routing_coupled_v4.py --config "$CONFIG" --output-dir "$OUTPUT" --audit-path "$OUTPUT/adversarial-audit/audit.json"
          python scripts/report_routing_coupled_v4.py --metrics "$OUTPUT/metrics.json" --audit "$OUTPUT/adversarial-audit/audit.json" --output docs/results/2026-07-30-routing-coupled-v4-analysis.md
          PYTHONPATH=. pytest -q
      - name: Record environment and integrity manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs/routing-coupled-v4 artifacts/2026-07-30/routing-coupled-v4
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,platform,subprocess,sys,yaml
          import numpy,torch
          config=Path('configs/pre_qwen_routing_coupled_v4.yaml')
          payload={'python':sys.version,'platform':platform.platform(),'torch':torch.__version__,'numpy':numpy.__version__,'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'configuration_sha256':hashlib.sha256(config.read_bytes()).hexdigest(),'protocol_version':yaml.safe_load(config.read_text())['protocol_version'],'workflow_run_id':int(os.environ['GITHUB_RUN_ID'])}
          Path('runs/routing-coupled-v4/environment.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUTPUT" runs/routing-coupled-v4 docs/results/2026-07-30-routing-coupled-v4-analysis.md -type f -print0 | sort -z | xargs -0 sha256sum > artifacts/2026-07-30/routing-coupled-v4/SHA256SUMS
          sha256sum -c artifacts/2026-07-30/routing-coupled-v4/SHA256SUMS
      - name: Commit every scientific artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "results: record audited routing-coupled residual v4"
          git push origin "HEAD:${TARGET_BRANCH}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routing-coupled-v4-final-complete
          path: |
            results/pre-qwen-routing-coupled/v4
            runs/routing-coupled-v4
            artifacts/2026-07-30/routing-coupled-v4
            docs/results/2026-07-30-routing-coupled-v4-analysis.md
          if-no-files-found: error
          retention-days: 30

  record-failure:
    if: >-
      always() &&
      (needs.preflight.result != 'success' || needs.seed.result != 'success' || needs.aggregate.result != 'success')
    needs: [preflight, seed, aggregate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Commit workflow failure marker
        shell: bash
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          SEEDS: ${{ needs.seed.result }}
          AGGREGATE: ${{ needs.aggregate.result }}
        run: |
          set -euo pipefail
          mkdir -p runs/routing-coupled-v4
          printf '{"run_id":%s,"preflight":"%s","seed_matrix":"%s","aggregate":"%s","status":"failure"}\n' "$GITHUB_RUN_ID" "$PREFLIGHT" "$SEEDS" "$AGGREGATE" > runs/routing-coupled-v4/latest-workflow-status.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runs/routing-coupled-v4/latest-workflow-status.json
          git commit -m "diagnostics: record final routing-coupled v4 workflow failure"
          git push origin "HEAD:${TARGET_BRANCH}"
