name: Import and verify full Modal-MoE handoff v1

on:
  push:
    branches:
      - agent/alignment-tolerant-v1
    paths:
      - ".github/import/handoff-full-v1/**"
      - ".github/workflows/import-full-handoff-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-full-handoff-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-import-persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify fragments and reconstruct exact handoff
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p runs/handoff-import-v1
          expected_file=/tmp/expected-fragments.sha256
          cat > "$expected_file" <<'EOF'
          a42b828e65e7041917638a8c495a311b8c3c7eda26a80ed576ffa059aebe8d84  .github/import/handoff-full-v1/part-00.b64
          2bc670a080738f59a937d29755a981370185bb9e7735e71106336da768cdbf11  .github/import/handoff-full-v1/part-01.b64
          46bea8f5e8d881c9850de7c4f7595eeaf0d732d48627f38aef1ad0c19b271c67  .github/import/handoff-full-v1/part-02.b64
          4f55a732dc34f45d34d8670a2fbe3b1d83c6393c4990fabc390f0220b06fe10f  .github/import/handoff-full-v1/part-03.b64
          55c7c47e96f76b89e82d54b90c436329bb43d105dba1c0fb2c0f92d23c118c11  .github/import/handoff-full-v1/part-04.b64
          EOF

          set +e
          sha256sum -c "$expected_file" > runs/handoff-import-v1/fragment-check.log 2>&1
          fragment_rc=$?
          cat .github/import/handoff-full-v1/part-*.b64 \
            | base64 --decode > /tmp/HANDOFF_MODAL_MOE_RESEARCH_2026-07-28_FULL.md 2> runs/handoff-import-v1/base64-decode.log
          decode_rc=$?
          printf '%s  %s\n' \
            '470b1b04801bbe2d163016ef593b553fe43dc3dd2274c26b7a732bcdcb2357fd' \
            '/tmp/HANDOFF_MODAL_MOE_RESEARCH_2026-07-28_FULL.md' \
            | sha256sum -c - > runs/handoff-import-v1/decoded-check.log 2>&1
          decoded_rc=$?
          decoded_sha=$(sha256sum /tmp/HANDOFF_MODAL_MOE_RESEARCH_2026-07-28_FULL.md 2>/dev/null | awk '{print $1}')
          decoded_bytes=$(wc -c < /tmp/HANDOFF_MODAL_MOE_RESEARCH_2026-07-28_FULL.md 2>/dev/null || printf '0')
          set -e

          python - "$fragment_rc" "$decode_rc" "$decoded_rc" "$decoded_sha" "$decoded_bytes" <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          fragment_rc, decode_rc, decoded_rc = map(int, sys.argv[1:4])
          payload = {
              "status": "PASS" if fragment_rc == decode_rc == decoded_rc == 0 else "FAIL",
              "fragment_check_returncode": fragment_rc,
              "base64_decode_returncode": decode_rc,
              "decoded_check_returncode": decoded_rc,
              "expected_decoded_sha256": "470b1b04801bbe2d163016ef593b553fe43dc3dd2274c26b7a732bcdcb2357fd",
              "observed_decoded_sha256": sys.argv[4],
              "observed_decoded_bytes": int(sys.argv[5]),
              "expected_decoded_bytes": 37465,
              "source_sha": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "recorded_at": datetime.now(timezone.utc).isoformat(),
          }
          Path("runs/handoff-import-v1/verification.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

          if [[ "$fragment_rc" -ne 0 || "$decode_rc" -ne 0 || "$decoded_rc" -ne 0 || "$decoded_bytes" -ne 37465 ]]; then
            exit 1
          fi

          cp /tmp/HANDOFF_MODAL_MOE_RESEARCH_2026-07-28_FULL.md \
            docs/HANDOFF_MODAL_MOE_RESEARCH_2026-07-28_FULL.md
          rm -rf .github/import/handoff-full-v1
          rm -f .github/workflows/import-full-handoff-v1.yml

      - name: Commit verified handoff or failure diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            docs/HANDOFF_MODAL_MOE_RESEARCH_2026-07-28_FULL.md \
            runs/handoff-import-v1 \
            .github/import/handoff-full-v1 \
            .github/workflows/import-full-handoff-v1.yml
          if git diff --cached --quiet; then
            echo "No handoff import changes to commit"
          else
            if [[ "${{ steps.verify.outcome }}" == "success" ]]; then
              git commit -m "docs: persist exact verified Modal-MoE research handoff"
            else
              git commit -m "diagnostic: record failed full handoff verification"
            fi
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Fail after preserving diagnostics
        if: steps.verify.outcome != 'success'
        shell: bash
        run: exit 1
