name: Import verified full Modal-MoE handoff

on:
  push:
    branches:
      - agent/alignment-tolerant-v1
    paths:
      - ".github/workflows/import-full-handoff-v1.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs/handoff-import-v1
          cat .github/import/handoff-full-v1/part-*.b64 | base64 -d > /tmp/handoff.md
          test "$(wc -c < /tmp/handoff.md)" -eq 37465
          echo "470b1b04801bbe2d163016ef593b553fe43dc3dd2274c26b7a732bcdcb2357fd  /tmp/handoff.md" | sha256sum -c - | tee runs/handoff-import-v1/decoded-check.log
          cp /tmp/handoff.md docs/HANDOFF_MODAL_MOE_RESEARCH_2026-07-28_FULL.md
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          files = sorted(Path('.github/import/handoff-full-v1').glob('part-*.b64'))
          fragments = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in files}
          payload = {
              'status': 'PASS',
              'decoded_bytes': 37465,
              'decoded_sha256': '470b1b04801bbe2d163016ef593b553fe43dc3dd2274c26b7a732bcdcb2357fd',
              'fragment_sha256': fragments,
              'source_sha': os.environ.get('GITHUB_SHA'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'recorded_at': datetime.now(timezone.utc).isoformat(),
          }
          Path('runs/handoff-import-v1/verification.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          rm -rf .github/import/handoff-full-v1
          rm -f .github/workflows/import-full-handoff-v1.yml
      - name: Persist exact document
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -m "docs: persist exact verified Modal-MoE research handoff"
          git push origin "HEAD:${GITHUB_REF_NAME}"
