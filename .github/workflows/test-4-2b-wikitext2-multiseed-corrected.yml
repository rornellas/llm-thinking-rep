name: Modal MoE — Test 4.2b WikiText-2 multi-seed corrected

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-4-2b-wikitext2-multiseed-corrected.yml"

permissions:
  contents: write

concurrency:
  group: modal-moe-test-4-2b-wikitext2-multiseed
  cancel-in-progress: false

jobs:
  multiseed-matched:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      NUMEXPR_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_XET: "1"
      HF_HOME: /tmp/huggingface

    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Register run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          payload = {
              "workflow": "Test 4.2b WikiText-2 multi-seed corrected",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "status": "running",
              "commit": os.environ["GITHUB_SHA"],
              "started_at": datetime.now(timezone.utc).isoformat(),
          }
          Path("runs/test-4-2b-latest.json").write_text(json.dumps(payload, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/test-4-2b-latest.json
          git commit -m "chore: register Test 4.2b run ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu "torch>=2.3"
          python -m pip install --no-cache-dir "numpy>=2.0" "datasets>=4.0" "tokenizers>=0.20"

      - name: Prepare deterministic WikiText-2 BPE corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/test-4-2b results/test-4-2b/latest
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          from datasets import load_dataset
          from tokenizers import Tokenizer, decoders, models, pre_tokenizers, trainers

          root = Path("data/test-4-2b")
          dataset = load_dataset("Salesforce/wikitext", "wikitext-2-raw-v1")
          train_lines = [row["text"] for row in dataset["train"] if row["text"].strip()]
          validation_lines = [row["text"] for row in dataset["validation"] if row["text"].strip()]
          tokenizer = Tokenizer(models.BPE(unk_token="<unk>"))
          tokenizer.pre_tokenizer = pre_tokenizers.ByteLevel(add_prefix_space=False)
          tokenizer.decoder = decoders.ByteLevel()
          tokenizer.train_from_iterator(
              train_lines,
              trainer=trainers.BpeTrainer(
                  vocab_size=2048,
                  min_frequency=2,
                  special_tokens=["<unk>"],
                  show_progress=False,
              ),
          )
          tokenizer.save(str(root / "tokenizer.json"))

          def encode(lines):
              ids = []
              for line in lines:
                  ids.extend(tokenizer.encode(line + "\n").ids)
              return np.asarray(ids, dtype=np.int32)

          train = encode(train_lines)
          validation = encode(validation_lines)
          np.save(root / "train.npy", train)
          np.save(root / "validation.npy", validation)
          manifest = {
              "train_path": str(root / "train.npy"),
              "validation_path": str(root / "validation.npy"),
              "vocab_size": tokenizer.get_vocab_size(),
              "dataset": "Salesforce/wikitext",
              "subset": "wikitext-2-raw-v1",
          }
          (root / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          stats = {
              **manifest,
              "train_documents": len(train_lines),
              "validation_documents": len(validation_lines),
              "train_tokens": int(train.size),
              "validation_tokens": int(validation.size),
          }
          Path("results/test-4-2b/latest/dataset_stats.json").write_text(json.dumps(stats, indent=2) + "\n")
          print(json.dumps(stats, indent=2))
          PY
          test -s data/test-4-2b/manifest.json

      - name: Validate experiment source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile experiments/test_4_2_wikitext2_multiseed_compute_matched.py

      - name: Run paired three-seed comparison
        shell: bash
        run: |
          set -euo pipefail
          python experiments/test_4_2_wikitext2_multiseed_compute_matched.py \
            --source experiments/test_2_0_modal_moe_trainability.py \
            --manifest data/test-4-2b/manifest.json \
            --output-dir results/test-4-2b/latest \
            --seeds 42420,43430,44440 \
            --steps 350 \
            --threads 4 \
            2>&1 | tee test-4-2b.log

      - name: Publish verdict
        if: always()
        shell: bash
        run: |
          [[ -f results/test-4-2b/latest/VERDICT.md ]] && cat results/test-4-2b/latest/VERDICT.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Persist result
        if: always()
        shell: bash
        env:
          RUN_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p results/test-4-2b/latest runs
          [[ -f test-4-2b.log ]] && cp test-4-2b.log results/test-4-2b/latest/
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          marker = Path("runs/test-4-2b-latest.json")
          payload = json.loads(marker.read_text()) if marker.exists() else {}
          payload.update({
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "status": os.environ["RUN_STATUS"],
              "finished_at": datetime.now(timezone.utc).isoformat(),
          })
          marker.write_text(json.dumps(payload, indent=2) + "\n")
          Path("results/test-4-2b/latest/run.json").write_text(json.dumps(payload, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/test-4-2b-latest.json results/test-4-2b/latest
          git commit -m "results: Test 4.2b ${GITHUB_RUN_ID} (${RUN_STATUS})" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modal-moe-test-4-2b-${{ github.run_id }}
          path: |
            results/test-4-2b/latest
            test-4-2b.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9
