name: Modal MoE — Test 1.0b activation subspaces retry

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-1-0b-activation-subspaces-retry.yml"

permissions:
  contents: write

concurrency:
  group: modal-moe-test-1-0-activation-subspaces
  cancel-in-progress: true

jobs:
  activation-subspaces:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      NUMEXPR_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Register retry run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          payload = {"workflow": "Modal MoE — Test 1.0b activation subspaces retry", "run_id": int(os.environ["GITHUB_RUN_ID"]), "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]), "status": "running", "commit": os.environ["GITHUB_SHA"], "started_at": datetime.now(timezone.utc).isoformat()}
          Path("runs/test-1-0b-latest.json").write_text(json.dumps(payload, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/test-1-0b-latest.json
          git commit -m "chore: register activation retry ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Install build and analysis dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build libgomp1
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir "numpy>=2.0" "huggingface_hub>=0.24"

      - name: Build pinned llama.cpp activation collector
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          cd "$RUNNER_TEMP/llama.cpp"
          git checkout d4d057b6dd6a9df2a44479a68d737154600e6162
          cp "$GITHUB_WORKSPACE/experiments/test_1_0_activation_capture.cpp" examples/eval-callback/eval-callback.cpp
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=OFF
          cmake --build build --target llama-eval-callback -j4

      - name: Validate analysis
        shell: bash
        run: python experiments/test_1_0_analyze_activation_subspaces.py --self-test

      - name: Restore official GGUF cache
        id: model-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/olmoe-gguf
          key: olmoe-1b-7b-0924-q4-k-m-3a970199d0f87db4e3e57275abb93812bf10fd83

      - name: Download official OLMoE Q4_K_M GGUF
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          print(hf_hub_download(repo_id="allenai/OLMoE-1B-7B-0924-GGUF", filename="olmoe-1b-7b-0924-q4_k_m.gguf", local_dir=os.path.join(os.environ["RUNNER_TEMP"], "olmoe-gguf")))
          PY

      - name: Resolve model path
        shell: bash
        run: |
          set -euo pipefail
          model_path="$(find "$RUNNER_TEMP/olmoe-gguf" -maxdepth 3 -name 'olmoe-1b-7b-0924-q4_k_m.gguf' -print -quit)"
          test -s "$model_path"
          printf '%s' "$model_path" > "$RUNNER_TEMP/olmoe_gguf_path.txt"
          ls -lh "$model_path"

      - name: Capture layer-7 activations
        shell: bash
        env:
          CAPTURE_DIR: ${{ github.workspace }}/activation_capture
          CAPTURE_MAX_TOKENS: "768"
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/llama.cpp/build/bin/llama-eval-callback" \
            -m "$(cat "$RUNNER_TEMP/olmoe_gguf_path.txt")" \
            -f experiments/calibration_corpus_multidomain.txt \
            -c 1024 -b 768 -ub 768 -t 4 \
            2>&1 | tee activation-capture.log
          find activation_capture -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          test -n "$(find activation_capture -maxdepth 1 -name '*ffn_norm-7*.f32' -print -quit)"

      - name: Analyze held-out activation subspaces
        shell: bash
        run: |
          set -euo pipefail
          python experiments/test_1_0_analyze_activation_subspaces.py --capture-dir activation_capture --output-dir results/test-1-0/latest --ranks 16,32,64,128,192,256,384,512 --seed 20260730 2>&1 | tee activation-analysis.log

      - name: Publish verdict
        if: always()
        shell: bash
        run: |
          [[ -f results/test-1-0/latest/VERDICT.md ]] && cat results/test-1-0/latest/VERDICT.md >> "$GITHUB_STEP_SUMMARY" || echo 'No verdict produced.' >> "$GITHUB_STEP_SUMMARY"

      - name: Persist result
        if: always()
        shell: bash
        env:
          RUN_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p results/test-1-0/latest
          [[ -f activation-capture.log ]] && cp activation-capture.log results/test-1-0/latest/
          [[ -f activation-analysis.log ]] && cp activation-analysis.log results/test-1-0/latest/
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          marker = Path("runs/test-1-0b-latest.json")
          payload = json.loads(marker.read_text()) if marker.exists() else {}
          payload.update({"run_id": int(os.environ["GITHUB_RUN_ID"]), "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]), "status": os.environ["RUN_STATUS"], "finished_at": datetime.now(timezone.utc).isoformat()})
          marker.write_text(json.dumps(payload, indent=2) + "\n")
          Path("results/test-1-0/latest/run.json").write_text(json.dumps(payload, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/test-1-0b-latest.json results/test-1-0/latest
          git commit -m "results: activation retry ${GITHUB_RUN_ID} (${RUN_STATUS})" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload activation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olmoe-test-1-0b-activation-subspaces-${{ github.run_id }}
          path: |
            activation_capture
            results/test-1-0/latest
            activation-capture.log
            activation-analysis.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
