name: Modal MoE — Test 2.11 marginal utility multi-seed

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-2-11-marginal-utility-multiseed.yml"
      - "experiments/test_2_11_marginal_utility_multiseed.py"

permissions:
  contents: write

concurrency:
  group: modal-moe-test-2-11-marginal-utility-multiseed
  cancel-in-progress: true

jobs:
  marginal-utility-multiseed:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      NUMEXPR_NUM_THREADS: "4"

    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Register workflow run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "workflow": "Modal MoE — Test 2.11 marginal utility multi-seed",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "status": "running",
              "commit": os.environ["GITHUB_SHA"],
              "started_at": datetime.now(timezone.utc).isoformat(),
          }
          Path("runs/test-2-11-latest.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/test-2-11-latest.json
          git commit -m "chore: register marginal-utility multiseed run ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu "torch>=2.3"
          python -m pip install --no-cache-dir "numpy>=2.0"

      - name: Materialize pinned Tiny Shakespeare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python - <<'PY'
          import base64
          import json
          import urllib.request
          from pathlib import Path

          blob_sha = "7dcb3a2d4cc3b48b6283dd46870bfeb78f88aac9"
          request = urllib.request.Request(
              f"https://api.github.com/repos/karpathy/char-rnn/git/blobs/{blob_sha}",
              headers={"Accept": "application/vnd.github+json", "User-Agent": "modal-moe-experiment"},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = json.load(response)
          if payload.get("sha") != blob_sha or payload.get("encoding") != "base64":
              raise RuntimeError(payload)
          Path("data/tinyshakespeare.txt").write_bytes(base64.b64decode(payload["content"]))
          PY
          test -s data/tinyshakespeare.txt

      - name: Validate aggregation source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            experiments/test_2_10_marginal_utility_controller.py \
            experiments/test_2_10b_extended_utility_price.py \
            experiments/test_2_11_marginal_utility_multiseed.py
          python experiments/test_2_10b_extended_utility_price.py \
            --source experiments/test_2_0_modal_moe_trainability.py \
            --progressive-source experiments/test_2_6_progressive_nested_modes.py \
            --controller-source experiments/test_2_7_learned_rank_controller.py \
            --text data/tinyshakespeare.txt \
            --self-test

      - name: Run three fresh utility-controller seeds
        shell: bash
        run: |
          set -euo pipefail
          python experiments/test_2_11_marginal_utility_multiseed.py \
            --runner-source experiments/test_2_10b_extended_utility_price.py \
            --source experiments/test_2_0_modal_moe_trainability.py \
            --progressive-source experiments/test_2_6_progressive_nested_modes.py \
            --controller-source experiments/test_2_7_learned_rank_controller.py \
            --text data/tinyshakespeare.txt \
            --output-dir results/test-2-11/latest \
            --seeds 61616,71717,81818 \
            --steps 400 \
            --threads 4 \
            --train-batches 32 \
            --tune-batches 24 \
            --test-batches 24 \
            --controller-steps 800 \
            --controller-hidden 96 \
            2>&1 | tee marginal-utility-multiseed.log

      - name: Publish verdict
        if: always()
        shell: bash
        run: |
          verdict="results/test-2-11/latest/VERDICT.md"
          if [[ -f "$verdict" ]]; then
            cat "$verdict" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' '## Test 2.11' '' 'No verdict was produced. Inspect marginal-utility-multiseed.log.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Persist compact results
        if: always()
        shell: bash
        env:
          RUN_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p results/test-2-11/latest runs
          [[ -f marginal-utility-multiseed.log ]] && cp marginal-utility-multiseed.log results/test-2-11/latest/
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          marker = Path("runs/test-2-11-latest.json")
          payload = json.loads(marker.read_text(encoding="utf-8")) if marker.exists() else {}
          payload.update({
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "status": os.environ["RUN_STATUS"],
              "finished_at": datetime.now(timezone.utc).isoformat(),
          })
          marker.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          Path("results/test-2-11/latest/run.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/test-2-11-latest.json results/test-2-11/latest
          git commit -m "results: marginal utility multiseed ${GITHUB_RUN_ID} (${RUN_STATUS})" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modal-moe-test-2-11-marginal-utility-multiseed-${{ github.run_id }}
          path: |
            results/test-2-11/latest
            marginal-utility-multiseed.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9
