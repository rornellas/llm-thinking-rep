name: Dense Control Gate 1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dense-control-gate-1.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dense-control-gate-1
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned preflight and data dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install numpy==2.3.5 scipy==1.17.0 PyYAML==6.0.3 pytest==8.4.2 datasets==5.0.1 tokenizers==0.23.1
      - name: Test model math budgets gradients and statistical contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs/dense-control-gate-1
          python scripts/run_dense_control_gate_1.py preflight | tee runs/dense-control-gate-1/model-preflight.json
          python scripts/aggregate_dense_control_gate_1.py --self-test | tee runs/dense-control-gate-1/statistics-preflight.json
          PYTHONPATH=. pytest -q tests/test_dense_control_gate_1.py tests/test_functional_ablation.py tests/test_heterogeneous_rank.py tests/test_native_compact.py | tee runs/dense-control-gate-1/preflight.log
      - name: Prepare new independent true-article holdout
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_dense_control_gate_1.py | tee runs/dense-control-gate-1/data-preparation.log
      - uses: actions/upload-artifact@v4
        with:
          name: dcg1-holdout
          path: data/dense-control-gate-1
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dcg1-preflight
          path: runs/dense-control-gate-1
          if-no-files-found: warn
          retention-days: 30
  cell:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        index: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned experiment runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install numpy==2.3.5 scipy==1.17.0 PyYAML==6.0.3
      - name: Train paired candidates without primary holdout and freeze states
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test ! -e data/dense-control-gate-1/windows.npy
          mkdir -p results/dense-control-gate-1/cell-${{ matrix.index }}
          python scripts/run_dense_control_gate_1.py train --index ${{ matrix.index }} 2>&1 | tee results/dense-control-gate-1/cell-${{ matrix.index }}/training.log
          test -e results/dense-control-gate-1/cell-${{ matrix.index }}/frozen.json
      - name: Open primary holdout only after frozen checkpoints
        uses: actions/download-artifact@v4
        with:
          name: dcg1-holdout
          path: data/dense-control-gate-1
      - name: Evaluate fixed final models measure runtime and reexecute exports
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_dense_control_gate_1.py evaluate --index ${{ matrix.index }} 2>&1 | tee results/dense-control-gate-1/cell-${{ matrix.index }}/evaluation.log
          git diff --exit-code -- pre_qwen_certification scripts docs/prereg configs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dcg1-cell-${{ matrix.index }}
          path: results/dense-control-gate-1/cell-${{ matrix.index }}
          if-no-files-found: warn
          retention-days: 30
  aggregate:
    needs: cell
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: dcg1-cell-*
          path: /tmp/dcg1-cells
      - uses: actions/download-artifact@v4
        with:
          name: dcg1-holdout
          path: data/dense-control-gate-1
      - uses: actions/download-artifact@v4
        with:
          name: dcg1-preflight
          path: runs/dense-control-gate-1
      - name: Restore individual cells and perform frozen aggregation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/dense-control-gate-1
          for i in 0 1 2 3 4 5; do cp -r /tmp/dcg1-cells/dcg1-cell-$i results/dense-control-gate-1/cell-$i; done
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python scripts/aggregate_dense_control_gate_1.py > runs/dense-control-gate-1/aggregation.log
          cat runs/dense-control-gate-1/aggregation.log
          sha256sum -c results/dense-control-gate-1/SHA256SUMS
          python - <<'PY'
          import json,os
          from pathlib import Path
          summary=json.loads(Path('results/dense-control-gate-1/summary.json').read_text())
          Path('runs/dense-control-gate-1/execution.json').write_text(json.dumps({
              'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),
              'source_commit':os.environ['GITHUB_SHA'],
              'scientific_verdict':summary['verdict'],
              'global_decision':'NO_GO_FOR_OLMOE_OR_QWEN'
          },indent=2)+'\n')
          PY
      - name: Preserve all source-linked results directly on main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/dense-control-gate-1 results/dense-control-gate-1 runs/dense-control-gate-1 docs/results/2026-09-06-dense-control-gate-1.md
          git commit -m 'results: preserve six-seed matched dense comparison and frozen capacity verdict'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dcg1-complete
          path: |
            data/dense-control-gate-1
            results/dense-control-gate-1
            runs/dense-control-gate-1
            docs/results/2026-09-06-dense-control-gate-1.md
            docs/prereg/DENSE_CONTROL_GATE_1.md
            pre_qwen_certification/dense_control.py
            scripts/run_dense_control_gate_1.py
            scripts/prepare_dense_control_gate_1.py
            scripts/aggregate_dense_control_gate_1.py
            tests/test_dense_control_gate_1.py
          if-no-files-found: warn
          retention-days: 30
