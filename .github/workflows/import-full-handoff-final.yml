name: Final verified full handoff import

on:
  push:
    branches: [agent/alignment-tolerant-v1]
    paths: [.github/workflows/import-full-handoff-final.yml]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact transport and decoded document
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs/handoff-import-v1
          cat >/tmp/fragments.sha256 <<'EOF'
          a385fd61781ddda4b0699e4fedec7736efc7e5a2a986e1f58bae8ee4de2cfc64  .github/import/handoff-full-v1/part-00-00.b64
          3e609fe65f4106ff3fdd897b1b4ddbaf037f57bb4afc9d3cafffec3eb5914c40  .github/import/handoff-full-v1/part-00-01.b64
          3e0ae5863cec32ffc2aa8fb43bec84c3944a081cc072e6041c78d2546dd5102c  .github/import/handoff-full-v1/part-00-02.b64
          6eaa9ee457ba23129e95f0b206cbb11a425ddcbba8f78aed772c8e169af1b0e3  .github/import/handoff-full-v1/part-01-00.b64
          ac3d9408807513e1608ba0379b4d27c0840c9682c534b4578d2ec52ecfaa6a91  .github/import/handoff-full-v1/part-01-01.b64
          c9f605ccda4da31c794e6801d36cba6834f1aa2911c3d4184fdc1926fd2ce0a7  .github/import/handoff-full-v1/part-01-02.b64
          46bea8f5e8d881c9850de7c4f7595eeaf0d732d48627f38aef1ad0c19b271c67  .github/import/handoff-full-v1/part-02.b64
          4f55a732dc34f45d34d8670a2fbe3b1d83c6393c4990fabc390f0220b06fe10f  .github/import/handoff-full-v1/part-03.b64
          55c7c47e96f76b89e82d54b90c436329bb43d105dba1c0fb2c0f92d23c118c11  .github/import/handoff-full-v1/part-04.b64
          EOF
          sha256sum -c /tmp/fragments.sha256 | tee runs/handoff-import-v1/fragment-check.log
          cat .github/import/handoff-full-v1/part-*.b64 | base64 -d > /tmp/handoff.md
          test "$(wc -c </tmp/handoff.md)" -eq 37465
          echo '470b1b04801bbe2d163016ef593b553fe43dc3dd2274c26b7a732bcdcb2357fd  /tmp/handoff.md' \
            | sha256sum -c - | tee runs/handoff-import-v1/decoded-check.log
          cp /tmp/handoff.md docs/HANDOFF_MODAL_MOE_RESEARCH_2026-07-28_FULL.md
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          Path('runs/handoff-import-v1/verification.json').write_text(json.dumps({
              'status': 'PASS',
              'fragment_check_returncode': 0,
              'base64_decode_returncode': 0,
              'decoded_check_returncode': 0,
              'expected_decoded_bytes': 37465,
              'observed_decoded_bytes': 37465,
              'expected_decoded_sha256': '470b1b04801bbe2d163016ef593b553fe43dc3dd2274c26b7a732bcdcb2357fd',
              'observed_decoded_sha256': '470b1b04801bbe2d163016ef593b553fe43dc3dd2274c26b7a732bcdcb2357fd',
              'source_sha': os.environ.get('GITHUB_SHA'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'recorded_at': datetime.now(timezone.utc).isoformat(),
          }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          rm -rf .github/import/handoff-full-v1
          rm -f .github/workflows/import-full-handoff-v1.yml
          rm -f .github/workflows/import-full-handoff-final.yml
      - name: Commit verified canonical handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -m 'docs: persist exact verified Modal-MoE research handoff'
          git push origin HEAD:${GITHUB_REF_NAME}
