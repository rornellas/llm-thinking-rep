name: Modal MoE — Test 2.0 trainability from initialization

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-2-0-modal-trainability.yml"

permissions:
  contents: write

concurrency:
  group: modal-moe-test-2-0-trainability
  cancel-in-progress: true

jobs:
  trainability:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      NUMEXPR_NUM_THREADS: "4"

    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Register workflow run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          payload = {
              "workflow": "Modal MoE — Test 2.0 trainability from initialization",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "status": "running",
              "commit": os.environ["GITHUB_SHA"],
              "started_at": datetime.now(timezone.utc).isoformat(),
          }
          Path("runs/test-2-0-latest.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/test-2-0-latest.json
          git commit -m "chore: register modal-trainability run ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU-only training dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu "torch>=2.3"
          python -m pip install --no-cache-dir "numpy>=2.0"

      - name: Materialize pinned Tiny Shakespeare blob
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python - <<'PY'
          import base64
          import json
          import urllib.request
          from pathlib import Path

          blob_sha = "7dcb3a2d4cc3b48b6283dd46870bfeb78f88aac9"
          url = f"https://api.github.com/repos/karpathy/char-rnn/git/blobs/{blob_sha}"
          request = urllib.request.Request(url, headers={"Accept": "application/vnd.github+json", "User-Agent": "modal-moe-experiment"})
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = json.load(response)
          if payload["sha"] != blob_sha or payload["encoding"] != "base64":
              raise RuntimeError(payload)
          raw = base64.b64decode(payload["content"])
          Path("data/tinyshakespeare.txt").write_bytes(raw)
          print(f"wrote {len(raw):,} bytes from immutable Git blob {blob_sha}")
          PY
          test -s data/tinyshakespeare.txt

      - name: Validate fused modal algebra
        shell: bash
        run: python experiments/test_2_0_modal_moe_trainability.py --self-test

      - name: Train conventional and modal MoEs
        shell: bash
        run: |
          set -euo pipefail
          python experiments/test_2_0_modal_moe_trainability.py \
            --text data/tinyshakespeare.txt \
            --output-dir results/test-2-0/latest \
            --steps 400 \
            --batch-size 16 \
            --seq-len 64 \
            --seed 1337 \
            --modal-ranks 1,2,3 \
            --threads 4 \
            2>&1 | tee modal-trainability.log

      - name: Publish verdict in run summary
        if: always()
        shell: bash
        run: |
          verdict="results/test-2-0/latest/VERDICT.md"
          if [[ -f "$verdict" ]]; then
            cat "$verdict" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' '## Test 2.0' '' 'No verdict was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Persist compact result in repository
        if: always()
        shell: bash
        env:
          RUN_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p results/test-2-0/latest
          [[ -f modal-trainability.log ]] && cp modal-trainability.log results/test-2-0/latest/
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          marker = Path("runs/test-2-0-latest.json")
          payload = json.loads(marker.read_text(encoding="utf-8")) if marker.exists() else {}
          payload.update({
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "status": os.environ["RUN_STATUS"],
              "finished_at": datetime.now(timezone.utc).isoformat(),
          })
          marker.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          Path("results/test-2-0/latest/run.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/test-2-0-latest.json results/test-2-0/latest
          git commit -m "results: modal-trainability run ${GITHUB_RUN_ID} (${RUN_STATUS})" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload training diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modal-moe-test-2-0-trainability-${{ github.run_id }}
          path: |
            results/test-2-0/latest
            modal-trainability.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9
