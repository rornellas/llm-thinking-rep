name: Exact Compact Kernel 1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/exact-compact-kernel-1.yml']
permissions:
  contents: write
concurrency:
  group: exact-compact-kernel-1
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  cell:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        index: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install numpy==2.3.5 PyYAML==6.0.3 pytest==8.4.2 scipy==1.17.0
      - name: Test forward and gradient parity before timing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/exact-compact-kernel-1/cell-${{ matrix.index }}
          PYTHONPATH=. pytest -q tests/test_vectorized_compact.py tests/test_functional_ablation.py 2>&1 | tee results/exact-compact-kernel-1/cell-${{ matrix.index }}/preflight.log
      - name: Fixed benchmark and full calibration parity
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_exact_compact_kernel_1.py --index ${{ matrix.index }} 2>&1 | tee results/exact-compact-kernel-1/cell-${{ matrix.index }}/run.log
          git diff --exit-code -- pre_qwen_certification scripts tests docs/prereg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eck1-cell-${{ matrix.index }}
          path: results/exact-compact-kernel-1/cell-${{ matrix.index }}
          retention-days: 30
          if-no-files-found: warn
  aggregate:
    needs: cell
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: eck1-cell-*
          path: /tmp/eck1
      - name: Restore and audit results
        run: |
          mkdir -p results/exact-compact-kernel-1
          for i in 0 1 2 3; do cp -r /tmp/eck1/eck1-cell-$i results/exact-compact-kernel-1/cell-$i; done
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python scripts/aggregate_exact_compact_kernel_1.py
          sha256sum -c results/exact-compact-kernel-1/SHA256SUMS
      - name: Commit results to main with safe concurrency retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/exact-compact-kernel-1 docs/results/2026-09-04-exact-compact-kernel-1.md
          git commit -m 'results: record exact vectorized compact parity and measured CPU latency'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eck1-complete
          path: |
            results/exact-compact-kernel-1
            docs/results/2026-09-04-exact-compact-kernel-1.md
            docs/prereg/EXACT_COMPACT_KERNEL_1.md
            pre_qwen_certification/vectorized_compact.py
            scripts/run_exact_compact_kernel_1.py
            scripts/aggregate_exact_compact_kernel_1.py
            tests/test_vectorized_compact.py
          retention-days: 30
          if-no-files-found: warn
