name: Functional Ablation 1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/functional-ablation-1.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: functional-ablation-1
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
jobs:
  cell:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        index: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install numpy==2.3.5 PyYAML==6.0.3 pytest==8.4.2
      - name: Preflight before scientific evaluation
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONPATH=. pytest -q tests/test_functional_ablation.py tests/test_heterogeneous_rank.py tests/test_native_compact.py
      - name: Fixed ablations and model exports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/functional-ablation-1/cell-${{ matrix.index }}
          python scripts/run_functional_ablation_1.py --index ${{ matrix.index }} \
            2>&1 | tee results/functional-ablation-1/cell-${{ matrix.index }}/run.log
          sha256sum docs/prereg/FUNCTIONAL_ABLATION_1.md pre_qwen_certification/functional_ablation.py scripts/run_functional_ablation_1.py tests/test_functional_ablation.py > results/functional-ablation-1/cell-${{ matrix.index }}/SOURCE_SHA256SUMS
          git diff --exit-code -- pre_qwen_certification scripts tests configs docs/prereg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fa1-cell-${{ matrix.index }}
          path: results/functional-ablation-1/cell-${{ matrix.index }}
          if-no-files-found: warn
          retention-days: 30
  aggregate:
    needs: cell
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: fa1-cell-*
          path: /tmp/fa1
      - name: Restore cell directory structure
        run: |
          mkdir -p results/functional-ablation-1
          for i in 0 1 2 3; do cp -r /tmp/fa1/fa1-cell-$i results/functional-ablation-1/cell-$i; done
      - name: Aggregate and verify integrity
        run: |
          python -m pip install scipy==1.17.0
          python scripts/aggregate_functional_ablation_1.py
          sha256sum -c results/functional-ablation-1/SHA256SUMS
          for i in 0 1 2 3; do sha256sum -c results/functional-ablation-1/cell-$i/SOURCE_SHA256SUMS; done
      - name: Commit results and actual compressed exports to main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/functional-ablation-1 docs/results/2026-09-04-functional-ablation-1.md
          git commit -m 'results: record FA-1 ablations, compressed checkpoints and paired CPU runtime'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fa1-complete
          path: |
            results/functional-ablation-1
            docs/results/2026-09-04-functional-ablation-1.md
            docs/prereg/FUNCTIONAL_ABLATION_1.md
            scripts/aggregate_functional_ablation_1.py
          if-no-files-found: warn
          retention-days: 30
