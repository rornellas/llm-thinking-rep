name: Import Reality Gate 1A source

on:
  push:
    branches: [main]
    paths:
      - ".github/triggers/import-reality-gate-1a.txt"

permissions:
  contents: write

concurrency:
  group: import-reality-gate-1a
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/reality-gate-1a-pycache
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct and verify source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .github/import/reality-gate-1a/part-*.b64 | base64 -d > /tmp/reality-gate-1a-import.tar.xz
          echo "abc6703cc94d429bce6825f687d92a70b7164f8c0632e136e276957dc10b62ba  /tmp/reality-gate-1a-import.tar.xz" | sha256sum -c -
          tar -xJf /tmp/reality-gate-1a-import.tar.xz -C "$GITHUB_WORKSPACE"
          grep -v '  SOURCE_MANIFEST.sha256$' SOURCE_MANIFEST.sha256 | sha256sum -c -
      - name: Apply pre-scientific plateau fixture correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          test = Path('tests/test_reality_gate_plateau.py')
          text = test.read_text(encoding='utf-8')
          old = '''        {"step": 100, "validation_loss": 2.000, "route_distribution": [1.0, 1.0]},
                  {"step": 200, "validation_loss": 1.994, "route_distribution": [1.01, 0.99]},
                  {"step": 300, "validation_loss": 1.991, "route_distribution": [1.00, 1.00]},
                  {"step": 400, "validation_loss": 1.989, "route_distribution": [1.01, 0.99]},'''
          new = '''        {"step": 100, "validation_loss": 2.0000, "route_distribution": [1.0, 1.0]},
                  {"step": 200, "validation_loss": 1.9985, "route_distribution": [1.01, 0.99]},
                  {"step": 300, "validation_loss": 1.9975, "route_distribution": [1.00, 1.00]},
                  {"step": 400, "validation_loss": 1.9970, "route_distribution": [1.01, 0.99]},'''
          if old not in text:
              raise SystemExit('expected plateau fixture block not found')
          test.write_text(text.replace(old, new), encoding='utf-8')

          manifest = Path('SOURCE_MANIFEST.sha256')
          paths = []
          for line in manifest.read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              _, relative = line.split('  ', 1)
              if relative != 'SOURCE_MANIFEST.sha256':
                  paths.append(relative)
          manifest.write_text(
              ''.join(
                  f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}\n"
                  for path in paths
              ),
              encoding='utf-8',
          )
          PY
          sha256sum -c SOURCE_MANIFEST.sha256
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3"
          python -m pip install "numpy>=2.0,<3" "scipy>=1.11,<2" "PyYAML>=6.0,<7" "pytest>=8.0,<9"
      - name: Compile and test frozen source
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q pre_qwen_certification scripts tests
          PYTHONPATH=. pytest -q \
            tests/test_heterogeneous_rank.py \
            tests/test_reality_gate_data.py \
            tests/test_reality_gate_plateau.py \
            tests/test_reality_gate_protocol.py \
            tests/test_alignment_tolerant.py \
            tests/test_modal.py \
            tests/test_metrics.py
      - name: Commit readable source directly to main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/import/reality-gate-1a
          rm -f .github/triggers/import-reality-gate-1a.txt
          rm -f .github/workflows/import-reality-gate-1a.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "experiment: preregister Reality Gate 1A static heterogeneous rank"
          git push origin HEAD:main
