protocol_version: pre-qwen-routing-coupled-residual-v4
status: preregistered_before_materializing_v4_hypothesis_or_ood
purpose: >-
  Test whether an explicit permutation-invariant correction conditioned on the
  routed expert set can preserve teacher behavior and beat the frozen narrow65
  baseline while keeping expert parameters and dominant matrix compute below 65%.
claim_scope: exploratory_fixed_teacher_architecture_screen
threads: 1
source:
  routing_set_config: configs/pre_qwen_alignment_routing_set_v3.yaml
