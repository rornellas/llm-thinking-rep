  primary_base_state: shared-lora-r5-routing-set-v3
  rank6_state: shared-lora-r6-routing-set-v3
  narrow_state: narrow65-frozen-baseline
  full_state: full-continuation-control
model:
  seq_len: 48
  batch_size: 8
  d_model: 24
  n_heads: 4
  n_layers: 2
  d_ff: 40
  n_experts: 12
  top_k: 4
  learning_rate: 0.0004
  student_learning_rate: 0.001
  weight_decay: 0.02
  aux_weight: 0.01
  grad_clip: 1.0
seeds: [91121, 92129, 93133, 94151, 95153]
