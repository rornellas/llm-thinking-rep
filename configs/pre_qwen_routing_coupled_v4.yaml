  bootstrap_seed: 863117
  confidence: 0.95
gates:
  primary_hypothesis_ucb_max: 0.030
  primary_ood_ucb_max: 0.050
  every_seed_primary_hypothesis_delta_max: 0.060
  primary_minus_narrow65_ucb_max: 0.000
  primary_minus_rank6_ucb_max: 0.000
  primary_minus_v3_ucb_max: 0.000
  primary_kl_ucb_max: 0.200
  primary_top1_lcb_min: 0.780
  primary_local_nrmse_ucb_max: 0.240
  primary_counterfactual_nrmse_ucb_max: 0.280
  primary_cross_error_gap_vs_narrow_ucb_max: 0.040
  disabled_minus_primary_kl_lcb_min: 0.010
  disabled_minus_primary_loss_lcb_min: 0.000
  primary_minus_mean_only_kl_ucb_max: 0.000
  full_control_hypothesis_ucb_max: 0.010
  full_control_ood_ucb_max: 0.015
  primary_parameter_ratio_strict_max: 0.65
  primary_compute_ratio_max: 0.65
  arithmetic_tolerance: 0.000001
  require_independent_audit: true
decision_policy:
  pass: >-
    The primary passes absolute, every-seed, behavioral, paired narrow65 and
    rank6 comparisons, exact budget, clean-data, causal-coupling, full-control,
    and independent-audit gates.
  functional_signal: >-
    The primary materially and causally improves the frozen v3 base on KL,
    top-1, local or counterfactual fidelity while remaining below 65%, but does
    not establish non-inferiority to narrow65. This permits one architecture
    replication, not a real-checkpoint transplant.
  fail: >-
    The correction is not causally useful, does not improve behavioral fidelity,
    exceeds budget, or fails integrity controls. In that case this coupling form
    is closed and the native-training/heterogeneous-rank branch becomes primary.
  consequence: >-
    No outcome changes NO_GO_FOR_OLMOE_OR_QWEN. A PASS only authorizes a fresh
    replication on plateaued teachers plus measured runtime implementation.
