  train_documents: 28
  train_seed: 24017
  train_split: teacher-width-train-v1
  hypothesis_documents: 20
  hypothesis_seed: 611953
  hypothesis_split: routing-coupled-hypothesis-v4-confirmation
  ood_split: routing-coupled-ood-v4-confirmation
  windows_per_document: 3
  evaluation_window_seed: 749123
  capture_batches: 36
  capture_batch_size: 8
  near_duplicate_threshold: 0.70
