decision_policy:
  pass: >-
    Both scales reach the frozen plateau criterion; spectral heterogeneous rank
    remains within uniform parameter and expected-compute budgets on train and
    held-out routing; it beats uniform rank in loss and at least two behavioral
    endpoints; it is non-inferior to narrow65; scale trend, identity, data, and
    independent audit gates all pass.
  mechanism_signal: >-
    At least one plateaued scale establishes loss non-inferiority to uniform rank
    plus two behavioral improvements, with intact budgets and audit, but the full
    two-scale/narrow65 gate is not reached. This permits one fresh replication,
    not dynamic routing or a real checkpoint.
  fail: >-
    Plateau is not established, spectral allocation does not beat uniform rank,
    gains are explained by routing frequency alone, budgets drift on held-out
    routes, or integrity controls fail. Dynamic rank allocation is then blocked.
  consequence: >-
    No outcome changes NO_GO_FOR_OLMOE_OR_QWEN. Runtime and real-checkpoint work
    remain blocked until a later explicit gate.
