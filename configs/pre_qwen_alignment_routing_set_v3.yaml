decision_policy:
  pass: >-
    Rank-5 routing-set v3 passes absolute CE, per-seed, KL, top-1, local,
    counterfactual, covariance-gap, arithmetic, clean-data, full-control, and
    independent-audit gates; is non-inferior to narrow65; and is non-inferior to
    the expert-v2 objective under paired crossed intervals.
  mechanism_signal: >-
    The candidate materially improves KL, top-1, counterfactual fidelity, or the
    covariance gap versus v2 but misses paired non-inferiority to narrow65. This
    supports one fresh replication only if the improvement is consistent across
    seeds and no absolute quality gate fails catastrophically.
  fail: >-
    The candidate fails absolute fidelity, covariance, behavioral, arithmetic,
    data, or audit gates and does not improve the v2 mechanism. Objective-only
    tuning is then closed; the next step must change architecture or train the
    compact family natively before expert specialization hardens.
  consequence: >-
    No outcome changes NO_GO_FOR_OLMOE_OR_QWEN. A PASS authorizes only a fresh
    replication on plateaued teachers plus an optimized runtime implementation.
