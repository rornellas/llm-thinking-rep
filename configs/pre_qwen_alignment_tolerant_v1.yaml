statistics:
  bootstrap_samples: 20000
  bootstrap_seed: 417103
  confidence: 0.95
gates:
  primary_hypothesis_ucb_max: 0.030
  primary_ood_ucb_max: 0.050
  every_seed_primary_hypothesis_delta_max: 0.060
  primary_minus_narrow65_ucb_max: 0.000
  capacity_hypothesis_ucb_max: 0.030
  capacity_minus_narrow65_ucb_max: 0.000
  full_control_hypothesis_ucb_max: 0.010
  full_control_ood_ucb_max: 0.015
  primary_parameter_ratio_strict_max: 0.65
  primary_compute_ratio_strict_max: 0.65
  arithmetic_tolerance: 0.000001
  require_independent_audit: true
decision_policy:
  pass: >-
    The rank-5 primary passes absolute hypothesis and OOD fidelity, every-seed,
    arithmetic, clean-data, full-control, and independent-audit gates; its paired
    crossed interval is non-inferior to the frozen narrow-65 baseline; and both
    parameter and compute proxies are strictly below 65%.
  promising: >-
    The rank-5 primary misses only paired non-inferiority while rank-6, at exactly
    65% compute and below 65% parameters, matches or beats narrow-65. This is a
    development signal only and does not satisfy the less-than-65 compute target.
  fail: >-
    Rank-5 fails absolute fidelity, every-seed robustness, paired comparison,
    arithmetic, data, or audit gates, and rank-6 does not provide a credible
    capacity-control rescue.
  consequence: >-
    No outcome changes NO_GO_FOR_OLMOE_OR_QWEN. A PASS only justifies a fresh
    replication on plateaued teachers and a runtime implementation of the factorized
    execution. A FAIL falsifies this rank range and initialization under fixed small
    teachers; it does not falsify all alignment-tolerant architectures.
