  seq_len: 48
  batch_size: 8
  d_model: 24
  n_heads: 4
  n_layers: 2
  d_ff: 40
  n_experts: 12
  top_k: 4
  teacher_steps: 2200
  student_steps: 600
  learning_rate: 0.0004
  student_learning_rate: 0.001
  weight_decay: 0.02
  aux_weight: 0.01
  grad_clip: 1.0
