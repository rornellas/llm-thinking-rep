protocol_version: pre-qwen-alignment-tolerant-shared-low-rank-v1
status: preregistered_before_materializing_new_hypothesis_or_ood_documents
purpose: >-
  Test whether an alignment-tolerant full-width expert family, represented as a
  shared full-rank base plus expert-specific bilateral low-rank residuals, can
  match or beat the frozen teacher-informed conventional narrow-65 baseline on
  fresh held-out documents while using less than 65% of the expert parameters
  and routed matrix-operation proxy.
claim_scope: exploratory_fixed_teacher_replication
threads: 1
source:
  teacher_width_config: configs/pre_qwen_teacher_width_fresh_v1.yaml
  teacher_width_results: results/pre-qwen-teacher-width-fresh/v1
  required_source_verdict: TEACHER_WIDTH_65_REPLICATION_PASS
  baseline_state: magnitude-init-65
  full_control_state: full-continuation-control
